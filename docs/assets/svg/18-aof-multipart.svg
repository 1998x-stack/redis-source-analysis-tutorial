<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="aof-multipart-title aof-multipart-desc"><title id="aof-multipart-title">Redis 7.2 Multi-Part AOF 文件集合</title><desc id="aof-multipart-desc">manifest 描述当前 BASE、INCR 和 HISTORY 文件；BASE 是一次重写的初始状态，可为 RDB 或 AOF 格式，INCR 记录其后的写操作。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="410" y="75" width="380" height="85" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="600" y="106" class="head" text-anchor="middle">appendonly.aof.manifest</text><text x="600" y="133" class="sub" text-anchor="middle">按序记录 file / seq / type</text></g><g><rect x="65" y="275" width="300" height="135" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="215" y="306" class="head" text-anchor="middle">BASE（最多一个）</text><text x="215" y="333" class="sub" text-anchor="middle">appendonly.aof.N.base.rdb</text><text x="215" y="355" class="sub" text-anchor="middle">或 .base.aof</text><text x="215" y="377" class="sub" text-anchor="middle">重写时点的初始数据集</text></g><g><rect x="450" y="275" width="300" height="135" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="600" y="306" class="head" text-anchor="middle">INCR（一个或多个）</text><text x="600" y="333" class="sub" text-anchor="middle">appendonly.aof.N.incr.aof</text><text x="600" y="355" class="sub" text-anchor="middle">重写后继续追加写命令</text><text x="600" y="377" class="sub" text-anchor="middle">按 seq 顺序回放</text></g><g><rect x="835" y="275" width="300" height="135" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="985" y="306" class="head" text-anchor="middle">HISTORY（旧文件）</text><text x="985" y="333" class="sub" text-anchor="middle">旧 BASE / INCR</text><text x="985" y="355" class="sub" text-anchor="middle">成功切换后等待清理</text><text x="985" y="377" class="sub" text-anchor="middle">不属于当前回放集合</text></g><path d="M520 160 L220 265" fill="none" stroke="#52799b" stroke-width="2.5" marker-end="url(#arr)"/><text x="350" y="220" class="edge" text-anchor="middle">type=b</text><path d="M600 160 L600 265" fill="none" stroke="#167e80" stroke-width="2.5" marker-end="url(#arr)"/><text x="625" y="220" class="edge" text-anchor="middle">type=i</text><path d="M680 160 L980 265" fill="none" stroke="#71827f" stroke-width="2.5" marker-end="url(#arr)"/><text x="850" y="220" class="edge" text-anchor="middle">type=h</text><text x="34" y="548" font-size="13" fill="#71827f">Redis 7.0 起使用 Multi-Part AOF；不要把旧版单文件 AOF rewrite buffer 机制直接套到 7.2。</text></svg>