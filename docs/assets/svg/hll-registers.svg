<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-hll d-hll"><title id="t-hll">HyperLogLog：用寄存器分布估计去重基数</title><desc id="d-hll">Redis HLL_P=14，含 16384 个寄存器；稠密表示每寄存器 6 位，约 12 KiB 数据区，附加固定头部。</desc><defs><marker id="arr-hll" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-hll" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-hll)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">HyperLogLog：用寄存器分布估计去重基数</text><rect x="37" y="103" width="205" height="82" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="139.5" y="140" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">PFADD visitors</text><text x="139.5" y="163.68" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">输入按 64 位哈希</text><path d="M242 143L286 143" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-hll)"/><rect x="293" y="103" width="273" height="82" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="429.5" y="140" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">前 14 位选桶</text><text x="429.5" y="163.68" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">index ∈ [0,16383]</text><path d="M565 143L610 143" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-hll)"/><rect x="618" y="103" width="307" height="82" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"