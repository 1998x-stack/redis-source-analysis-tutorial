" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">14</text><rect x="871" y="259" width="49" height="64" rx="4" fill="#e4f4ef" stroke="#97bab4"/><text x="895" y="285" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">2</text><text x="895" y="315" fill="#587277" font-size="12" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">15</text><text x="48" y="377" fill="#264148" font-size="16" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">数据区 = 16384 × 6 bits = 98304 bits = 12288 bytes；估计标准误差约 0.81%。</text><text x="48" y="416" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">PFCOUNT 是近似去重计数，不可按 HLL 寄存器还原成员，也不应直接用来检查集合包含关系。</text></svg>