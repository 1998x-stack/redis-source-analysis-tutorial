<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-ae-loop d-ae-loop"><title id="t-ae-loop">aeMain：回调驱动的 file events + time events</title><desc id="d-ae-loop">aeProcessEvents 运行 beforeSleep，计算最早 timer 的等待时间，调用 aeApiPoll，处理文件事件，再处理时间事件。</desc><defs><marker id="arr-ae-loop" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-ae-loop" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-ae-loop)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">aeMain：回调驱动的 file events + time events</text><rect x="28" y="101" width="182" height="84" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="119" y="138" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">beforeSleep</text><text x="119" y="163.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">处理待写 / 内部任务</text><path d="M210 144L254 144" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-ae-loop)"/><rect x="260" y="101" width="199" height="84" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="359.5" y="138" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">aeApiPoll</text><text x="359.5" y="163.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">epoll/kqueue/select</text><path d="M460 144L504 144" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-ae-loop)"/><rect x="511" y="101" width="198" height="84" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="610" y="138" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">file callbacks</text><text x="610" y="163.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">READABLE / WRITABLE</text><path d="M710 144L749 144" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-ae-loop)"/><rect x="756" y="101" width="173" height="84" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="842.5" y="138" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">time events</text><text x="842.5" y="163.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">如 serverCron</text><rect x="202" y="303" width="550" height="91" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="477" y="340" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">aeMain 重复下一轮</text><text x="477" y="367" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">beforeSleep / afterSleep 不是独立事件，也不代表非阻塞 I/O 总不会等待</text><path d="M845 189L718 294" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-ae-loop)"/><path d="M230 304L119 189" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-ae-loop)"/><text x="43" y="435" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">aeProcessEvents 的轮询超时由最近 timer、DONT_WAIT 标志等共同决定；不要把 event loop 当作忙轮询。</text></svg>