<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-blocked desc-blocked"><title id="title-blocked">BLPOP：阻塞的是客户端，不是服务器事件循环</title><desc id="desc-blocked">空列表时客户端登记于 blocking_keys；生产者写入后 signalKeyAsReady，afterCommand 处理 ready_keys 并重执行等待命令。</desc><defs><marker id="arrow-blocked" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-blocked" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-blocked)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">BLPOP：阻塞的是客户端，不是服务器事件循环</text><rect x="40" y="103" width="240" height="87" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="160" y="141" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">消费者 BLPOP</text><text x="160" y="165.64" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">遍历 key 都没有元素</text><path d="M281 146L328 146" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked)"/><rect x="335" y="103" width="277" height="87" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="473.5" y="141" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">blockForKeys</text><text x="473.5" y="165.64" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">c-&gt;bstate · blocking_keys</text><path d="M615 146L662 146" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked)"/><rect x="670" y="103" width="252" height="87" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="796" y="141" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">CLIENT_BLOCKED</text><text x="796" y="165.64" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">事件循环仍可接收新请求</text><rect x="40" y="284" width="240" height="85" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="160" y="322" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">生产者 LPUSH</text><text x="160" y="345.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">dbAdd / signalKeyAsReady</text><path d="M283 328L330 328" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked)"/><rect x="337" y="284" width="277" height="85" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="475.5" y="322" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ready_keys</text><text x="475.5" y="345.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">去重排队、稍后处理</text><path d="M615 328L662 328" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked)"/><rect x="670" y="284" width="252" height="85" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="796" y="322" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">handleClientsBlockedOnKey</text><text x="796" y="345.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">公平服务 / 重新执行</text><path d="M796 199L796 275" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked)"/><text x="796" y="229" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">新命令</text><text x="43" y="436" fill="#557078" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">边界：0 超时表示无限等；超时退出、事务/script 的禁阻塞分支和断开连接走不同路径。</text></svg>