<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c27block-t c27block-d"><title id="c27block-t">阻塞客户端：让慢工作离开 Redis 主事件循环</title><desc id="c27block-d">模块命令在主线程申请 BlockClient，工作线程执行外部 I/O 或计算；如需调用 Redis API，使用 ThreadSafeContext 并加锁；UnblockClient 将完成回调交回 Redis 线程。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="40" y="110" width="245" height="110" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="162.5" y="141" class="head" text-anchor="middle">主线程命令</text><text x="162.5" y="169" class="sub" text-anchor="middle">BlockClient(ctx, callbacks)</text><text x="162.5" y="191" class="sub" text-anchor="middle">保存 blocked handle</text></g><g><rect x="350" y="110" width="245" height="110" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="472.5" y="141" class="head" text-anchor="middle">后台 worker</text><text x="472.5" y="169" class="sub" text-anchor="middle">外部 I/O / 计算</text><text x="472.5" y="191" class="sub" text-anchor="middle">不要直接复用原 ctx</text></g><g><rect x="660" y="110" width="245" height="110" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="782.5" y="141" class="head" text-anchor="middle">ThreadSafeContext</text><text x="782.5" y="169" class="sub" text-anchor="middle">GetThreadSafeContext</text><text x="782.5" y="191" class="sub" text-anchor="middle">Lock → API → Unlock</text></g><g><rect x="970" y="110" width="190" height="110" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="1065" y="141" class="head" text-anchor="middle">UnblockClient</text><text x="1065" y="169" class="sub" text-anchor="middle">投递解阻事件</text><text x="1065" y="191" class="sub" text-anchor="middle">回调回到主线程</text></g><path d="M285 165L345 165" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M595 165L655 165" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M905 165L965 165" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="365" y="345" width="470" height="100" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="600" y="376" class="head" text-anchor="middle">reply / timeout / free callbacks</text><text x="600" y="404" class="sub" text-anchor="middle">Redis 事件循环中处理回复和资源清理</text><text x="600" y="426" class="sub" text-anchor="middle">客户端断开也必须有清理路径</text></g><path d="M1060 220L1060 295L600 295L600 340" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="825" y="284" class="small" text-anchor="middle">回调</text><text x="32" y="550" font-size="13" fill="#6c817c">Redis 7.2.4 不允许在 Lua 脚本或 MULTI 中调用阻塞型 Module 命令。</text></svg>