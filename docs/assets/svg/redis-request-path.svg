<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title-request desc-request"><title id="title-request">一条 SET 请求的最短执行路径</title><desc id="desc-request">client 经过套接字事件、RESP 解析、命令调用、回复缓冲区；写入还可触发 AOF 和复制传播</desc><defs><marker id="arrow-request" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-request" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="420" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="420" fill="url(#dots-request)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">一条 SET 请求的最短执行路径</text><rect x="30" y="110" width="130" height="85" rx="12" fill="#f6efe8" stroke="#ca865f" stroke-width="1.8"/><text x="95" y="144" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">client</text><text x="95" y="169" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">RESP array</text><rect x="209" y="110" width="147" height="85" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="282.5" y="144" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">socket / ae</text><text x="282.5" y="169" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">读事件回调</text><rect x="405" y="110" width="150" height="85" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="480" y="144" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">网络输入</text><text x="480" y="169" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">readQuery