<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-threads d-threads"><title id="t-threads">I/O 线程 fan-out / fan-in，不是并行执行任意命令</title><desc id="d-threads">Redis 7.2 的 networking.c 在启用并达到条件后分配待处理 client 列表；线程读/写后，主线程等待同步，再继续主命令执行。</desc><defs><marker id="arr-threads" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-threads" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-threads)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">I/O 线程 fan-out / fan-in，不是并行执行任意命令</text><rect x="26" y="90" width="254" height="85" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="153" y="127" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">main thread</text><text x="153" y="152.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">clients_pending_read/write</text><path d="M282 133L328 133" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-threads)"/><rect x="332" y="90" width="295" height="85" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="479.5" y="127" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">fan-out</text><text x="479.5" y="152.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">io_threads_list[0..N-1]</text><path d="M629 133L676 133" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-threads)"/><rect x="681" y="90" width="247" height="85" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="804.5" y="127" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">I/O workers</text><text x="804.5" y="152.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">readQueryFromClient / writeToClient</text><rect x="42" y="279" width="279" height="89" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="181.5" y="316" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">同步点</text><text x="181.5" y="343" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">等待 pending = 0</text><path d="M324 323L374 323" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-threads)"/><rect x="378" y="279" width="247" height="89" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="501.5" y="316" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">主线程后处理</text><text x="501.5" y="343" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">解析 / 命令执行</text><path d="M627 323L678 323" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-threads)"/><rect x="682" y="279" width="241" height="89" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="802.5" y="316" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">回复输出</text><text x="802.5" y="343" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">可能注册写事件</text><path d="M817 179L181 267" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-threads)"/><text x="43" y="427" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">io-threads-do-reads 控制读侧是否使用线程；未满足阈值时会退回主线程同步处理。</text></svg>