<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-timers d-timers"><title id="t-timers">时间事件在 Redis 7.2.4 中是无序双向链表</title><desc id="d-timers">aeCreateTimeEvent 在链表头插入，usUntilEarliestTimer 遍历找最近到期；这不是一个二叉最小堆。</desc><defs><marker id="arr-timers" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-timers" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-timers)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">时间事件在 Redis 7.2.4 中是无序双向链表</text><rect x="40" y="89" width="249" height="84" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="164.5" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">timeEventHead</text><text x="164.5" y="151.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">head pointer · unordered</text><rect x="59" y="245" width="256" height="91" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="187" y="282" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ID 7</text><text x="187" y="309" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">when=+60ms</text><rect x="339" y="245" width="256" height="91" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="467" y="282" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ID 3</text><text x="467" y="309" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">when=+20ms</text><rect x="619" y="245" width="256" height="91" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="747" y="282" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ID 9</text><text x="747" y="309" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">when=+100ms</text><path d="M173 175L171 234" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-timers)"/><path d="M315 291L335 291" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-timers)"/><path d="M599 291L615 291" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-timers)"/><rect x="294" y="374" width="372" height="64" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="480" y="406" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">遍历取最小 when</text><text x="480" y="421.36" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">O(number of time events)</text><text x="42" y="430" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">到期执行后的返回值决定下一次延迟；AE_NOMORE 则删除该时间事件。</text></svg>