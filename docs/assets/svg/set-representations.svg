<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-set3 d-set3"><title id="t-set3">Set 的三种编码：数据决定物理表示</title><desc id="d-set3">Redis 7.2.4 的 Set 可能是 intset、listpack、HT。纯整数小集易用 intset，混合类型可能用 listpack，超阈值后转换为 HT。</desc><defs><marker id="arr-set3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-set3" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-set3)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Set 的三种编码：数据决定物理表示</text><rect x="34" y="98" width="252" height="80" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="160" y="135" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SADD key values</text><text x="160" y="157.2" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">按值类型与 size_hint 判定</text><path d="M287 139L333 139" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-set3)"/><rect x="343" y="98" width="275" height="80" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="480.5" y="135" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">setTypeCreate</text><text x="480.5" y="157.2" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">编码由内容和规模决定</text><path d="M619 139L668 139" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-set3)"/><rect x="681" y="98" width="242" height="80" rx="10" fill="#f9eee4" stroke="#bc7650" 