<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 485" aria-labelledby="t-setops d-setops"><title id="t-setops">集合运算：交集为何先选最小集合？</title><desc id="d-setops">SINTER 将参与集合按基数排序，以最小集合为驱动逐成员测试其他集合，减小候选遍历成本。</desc><defs><marker id="arr-setops" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-setops" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="485" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="485" fill="url(#dots-setops)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">集合运算：交集为何先选最小集合？</text><rect x="40" y="95" width="265" height="85" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="172.5" y="132" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">A：3 个成员</text><text x="172.5" y="157.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">{a, b, c}</text><rect x="353" y="95" width="265" height="85" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="485.5" y="132" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">B：6 个成员</text><text x="485.5" y="157.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">{b,c,d,e,f,g}</text><rect x="667" y="95" width="252" height="85" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="793" y="132" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">C：5 个成员</text><text x="793" y="157.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">{a,b,c,h,i}</text><path d="M172 182L339 252" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-setops)"/><path d="M483 182L484 252" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-setops)"/><path d="M791 182L640 252" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-setops)"/><rect x="238" y="263" width="485" height="100" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="480.5" y="300" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">按基数选择最小 A</text><text x="480.5" y="327" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">遍历 a,b,c，分别检测它们是否同时属于 B、C</text><path d="M479 365L479 391" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-setops)"/><rect x="347" y="394" width="266" height="52" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="480" y="420" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">交集 = {b,c}</text></svg>