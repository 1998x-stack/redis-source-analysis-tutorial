<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-geo d-geo"><title id="t-geo">Geo：经纬度交错成整数分数，再利用 ZSET 搜索候选</title><desc id="d-geo">GEOADD 将经纬度编码成 52 位地理哈希，再交给 ZADD。半径/矩形搜索使用覆盖框估计候选并做真实距离过滤。</desc><defs><marker id="arr-geo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-geo" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-geo)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Geo：经纬度交错成整数分数，再利用 ZSET 搜索候选</text><rect x="30" y="89" width="197" height="86" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="128.5" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">(lon, lat)</text><text x="128.5" y="152.64" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">经度 + 纬度</text><path d="M227 132L265 132" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-geo)"/><rect x="271" y="89" width="222" height="86" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="382" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">geohashEncode</text><text x="382" y="152.64" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">经纬度 bit interleave</text><path d="M493 132L539 132" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-geo)"/><rect x="546" y="89" width="177" height="86" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="634.5" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">52-bit score</text><text x="634.5" y="152.64" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">可精确表示为 double</text><path d="M723 132L762 132" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-geo)"/><rect x="768" y="89" width="163" height="86" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="849.5" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ZADD</text><text x="849.5" y="152.64" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">member → score</text><rect x="143" y="235" width="470" height="160" rx="9" fill="#e6f3ee" stroke="#79ad9b"/><path d="M143 235V395" stroke="#91bbb0" stroke-width="1.1"/><path d="M237 235V395" stroke="#91bbb0" stroke-width="1.1"/><path d="M331 235V395" stroke="#91bbb0" stroke-width="1.1"/><path d="M425 235V395" stroke="#91bbb0" stroke-width="1.1"/><path d="M519 235V395" stroke="#91bbb0" stroke-width="1.1"/><path d="M143 235H613" stroke="#91bbb0" stroke-width="1.1"/><path d="M143 288H613" stroke="#91bbb0" stroke-width="1.1"/><path d="M143 341H613" stroke="#91bbb0" stroke-width="1.1"/><path d="M143 394H613" stroke="#91bbb0" stroke-width="1.1"/><circle cx="379" cy="315" r="65" fill="#c8dfdb" fill-opacity=".4" stroke="#bc7650" stroke-width="2.8"/><circle cx="379" cy="315" r="5" fill="#bc7650"/><text x="660" y="266" fill="#264148" font-size="17" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">先取附近格网</text><text x="660" y="301" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">再过滤距离 / 形状</text><text x="660" y="349" fill="#bc7650" font-size="16" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">候选 ≠ 最终结果</text><text x="45" y="423" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">用有序分数缩小检索范围并不意味着仅靠 geohash 就得到精确几何距离。</text></svg>