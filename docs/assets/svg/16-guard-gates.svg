<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="cmd-guards-title cmd-guards-desc"><title id="cmd-guards-title">processCommand 的前置检查不是一个单独 ACL 判断</title><desc id="cmd-guards-desc">按 Redis 7.2.4 processCommand 的控制流，命令查找、认证、ACL、Cluster 路由、maxmemory、磁盘错误、复制状态、加载状态和暂停条件可能在命令处理器前拒绝或推迟请求。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="40" y="125" width="190" height="100" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="135" y="156" class="head" text-anchor="middle">命令识别</text><text x="135" y="183" class="sub" text-anchor="middle">lookupCommand</text><text x="135" y="205" class="sub" text-anchor="middle">存在 / arity</text></g><g><rect x="285" y="125" width="190" height="100" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="380" y="156" class="head" text-anchor="middle">身份与权限</text><text x="380" y="183" class="sub" text-anchor="middle">AUTH / ACL</text><text x="380" y="205" class="sub" text-anchor="middle">NOAUTH / NOPERM</text></g><g><rect x="530" y="125" width="190" height="100" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="625" y="156" class="head" text-anchor="middle">路由与资源</text><text x="625" y="183" class="sub" text-anchor="middle">Cluster slot</text><text x="625" y="205" class="sub" text-anchor="middle">maxmemory / OOM</text></g><g><rect x="775" y="125" width="190" height="100" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="870" y="156" class="head" text-anchor="middle">运行状态</text><text x="870" y="183" class="sub" text-anchor="middle">loading / stale</text><text x="870" y="205" class="sub" text-anchor="middle">disk error / replica</text></g><g><rect x="1010" y="125" width="150" height="100" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="1085" y="156" class="head" text-anchor="middle">可执行?</text><text x="1085" y="183" class="sub" text-anchor="middle">进入下一阶段</text></g><path d="M230 175 L280 175" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M475 175 L525 175" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M720 175 L770 175" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M965 175 L1005 175" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="150" y="330" width="245" height="100" rx="13" fill="#faecea" stroke="#b75d56" stroke-width="1.7"/><text x="272.5" y="361" class="head" text-anchor="middle">拒绝</text><text x="272.5" y="388" class="sub" text-anchor="middle">错误回复 + rejected_calls</text><text x="272.5" y="410" class="sub" text-anchor="middle">不会调用业务 proc</text></g><g><rect x="475" y="330" width="245" height="100" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="597.5" y="361" class="head" text-anchor="middle">重定向 / 推迟</text><text x="597.5" y="388" class="sub" text-anchor="middle">MOVED / ASK / PAUSE</text><text x="597.5" y="410" class="sub" text-anchor="middle">待条件满足后重试</text></g><g><rect x="800" y="330" width="245" height="100" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="922.5" y="361" class="head" text-anchor="middle">事务排队 / 执行</text><text x="922.5" y="388" class="sub" text-anchor="middle">QUEUED 或 call()</text><text x="922.5" y="410" class="sub" text-anchor="middle">不等同于事务回滚</text></g><path d="M375 225 L375 270 L270 270 L270 325" fill="none" stroke="#b75d56" stroke-width="2.5" marker-end="url(#arr)"/><text x="325" y="263" class="edge" text-anchor="middle">校验失败</text><path d="M625 225 L625 270 L595 270 L595 325" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="610" y="263" class="edge" text-anchor="middle">路由 / 暂停</text><path d="M1085 225 L1085 270 L925 270 L925 325" fill="none" stroke="#167e80" stroke-width="2.5" marker-end="url(#arr)"/><text x="1010" y="263" class="edge" text-anchor="middle">通过</text><text x="34" y="548" font-size="13" fill="#71827f">不是所有命令都走完全相同的拒绝分支；例如只读命令与写命令的检查条件不同。</text></svg>