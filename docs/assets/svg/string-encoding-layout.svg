<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-object-strings desc-object-strings"><title id="title-object-strings">String 的 int、embstr、raw 是不同内存布局</title><desc id="desc-object-strings">int 编码复用 ptr 位存数值；embstr 在同一块中存对象和 SDS；raw 的对象和 SDS 通常分开分配。</desc><defs><marker id="arrow-object-strings" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-object-strings" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-object-strings)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">String 的 int、embstr、raw 是不同内存布局</text><rect x="44" y="110" width="272" height="78" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="180" y="145.1" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">OBJ_ENCODING_INT</text><text x="180" y="166.16" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">小整数 / 可表示整型</text><rect x="343" y="110" width="272" height="78" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="479" y="145.1" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">OBJ_ENCODING_EMBSTR</text><text x="479" y="166.16" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">同一次分配：object + sdshdr8</text><rect x="644" y="110" width="272" height="78" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="780" y="145.1" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">OBJ_ENCODING_RAW</text><text x="780" y="166.16" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">object 与 SDS 分开</text><rect x="90" y="245" width="179" height="32" rx="7" fill="#efebfa" stroke="#bdd3cd"/><text x="179.5" y="267" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">object + ptr=value</text><rect x="349" y="245" width="113" height="32" rx="7" fill="#efebfa" stroke="#bdd3cd"/><text x="405.5" y="267" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">object</text><rect x="464" y="245" width="140" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="534" y="267" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SDS bytes</text><rect x="663" y="245" width="100" height="32" rx="7" fill="#efebfa" stroke="#bdd3cd"/><text x="713" y="267" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">object</text><rect x="786" y="334" width="112" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="842" y="356" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SDS bytes</text><path d="M763 261L835 323" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-object-strings)"/><text x="55" y="374" fill="#557078" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">createStringObject() 中的 44 字节阈值只说明创建时的一个分支；tryObjectEncoding 还可能再选择整数编码。</text><text x="55" y="411" fill="#b86245" font-size="15" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">修改 embstr 通常需转成 raw：不要把这三条表示视为不可变的“数据类型”。</text></svg>