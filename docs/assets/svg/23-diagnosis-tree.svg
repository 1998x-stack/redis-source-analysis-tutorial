<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r23diag-t r23diag-d"><title id="r23diag-t">从 P99 变差到可验证的性能假设</title><desc id="r23diag-d">先判断慢日志和内部延迟事件，然后结合 memory/persistence/clients/replication 指标选方向，再用 profiler 或最小复现实验证明因果。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="430" y="75" width="330" height="96" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="595" y="106" class="head" text-anchor="middle">P99 延迟升高</text><text x="595" y="134" class="sub" text-anchor="middle">先测客户端 RTT 与基线</text><text x="595" y="156" class="sub" text-anchor="middle">标记异常起止时间</text></g><g><rect x="80" y="245" width="290" height="105" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="225" y="276" class="head" text-anchor="middle">SLOWLOG 有命令</text><text x="225" y="304" class="sub" text-anchor="middle">检查 commandstats / key 大小</text><text x="225" y="326" class="sub" text-anchor="middle">定位 handler / 编码</text></g><g><rect x="455" y="245" width="290" height="105" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="600" y="276" class="head" text-anchor="middle">LATENCY 有事件</text><text x="600" y="304" class="sub" text-anchor="middle">fork / AOF / expire / command</text><text x="600" y="326" class="sub" text-anchor="middle">联动持久化和 CPU</text></g><g><rect x="830" y="245" width="290" height="105" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="975" y="276" class="head" text-anchor="middle">两者都缺失</text><text x="975" y="304" class="sub" text-anchor="middle">网络 RTT / CPU 调度</text><text x="975" y="326" class="sub" text-anchor="middle">拥塞、客户端排队、TLS</text></g><path d="M525 171L225 240" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="370" y="210" class="small" text-anchor="middle">handler?</text><path d="M595 171L595 240" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M665 171L975 240" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="820" y="210" class="small" text-anchor="middle">外部?</text><g><rect x="245" y="430" width="710" height="74" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="600" y="461" class="head" text-anchor="middle">确认手段：同窗口采样 + 可复现触发 + 固定版本源码路径</text><text x="600" y="489" class="sub" text-anchor="middle">只有指标同涨还不足以证明根因，必须检验替代解释</text></g><text x="32" y="550" font-size="13" fill="#6c817c">不要把 SLOWLOG 缺失判定为 Redis 绝对没有耗时；它受阈值、记录长度和计量边界影响。</text></svg>