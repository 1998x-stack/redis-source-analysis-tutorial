<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-reply d-reply"><title id="t-reply">回复缓冲区：短回复快路径、溢出链表、写事件</title><desc id="d-reply">client 固定 buf 能承载小回复；更大或剩余空间不足时追加 reply 链表块，写入可能仅部分完成并需注册 AE_WRITABLE。</desc><defs><marker id="arr-reply" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-reply" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-reply)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">回复缓冲区：短回复快路径、溢出链表、写事件</text><rect x="40" y="99" width="217" height="85" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="148.5" y="136" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">addReply*</text><text x="148.5" y="161.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">命令构造 RESP 回复</text><path d="M260 142L299 142" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-reply)"/><rect x="306" y="99" width="272" height="85" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="442" y="136" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">client.buf / bufpos</text><text x="442" y="161.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">小块固定缓冲</text><path d="M579 142L618 142" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-reply)"/><rect x="624" y="99" width="292" height="85" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="770" y="136" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">client.reply list</text><text x="770" y="161.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">动态 reply blocks</text><rect x="104" y="280" width="330" height="88" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="269" y="317" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">writeToClient</text><text x="269" y="344" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">一次可能只发出部分 bytes</text><path d="M434 323L493 323" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-reply)"/><rect x="498" y="280" width="359" height="88" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="677.5" y="317" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">仍有剩余 → AE_WRITABLE</text><text x="677.5" y="344" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">下轮可写回调继续发送</text><text x="44" y="423" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">硬限制 / 软限制主要保护客户端输出堆积；需按 client 类型配置，不是内存泄漏的通用证明。</text></svg>