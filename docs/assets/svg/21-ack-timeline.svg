<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r21ack-t r21ack-d"><title id="r21ack-t">复制 ACK 和 WAIT 的时间轴</title><desc id="r21ack-d">从主节点执行 SET、复制流发出、replica 应用和 REPLCONF ACK，到客户端 WAIT 计数；ACK 是应用偏移确认，非磁盘持久化确认。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="35" y="110" width="230" height="103" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="150" y="141" class="head" text-anchor="middle">客户端 C</text><text x="150" y="169" class="sub" text-anchor="middle">SET x 1 → WAIT 1 1000</text><text x="150" y="191" class="sub" text-anchor="middle">同一 TCP 连接</text></g><g><rect x="350" y="110" width="280" height="103" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="490" y="141" class="head" text-anchor="middle">Primary</text><text x="490" y="169" class="sub" text-anchor="middle">执行写命令并推进 offset</text><text x="490" y="191" class="sub" text-anchor="middle">复制流异步向副本发送</text></g><g><rect x="775" y="110" width="350" height="103" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="950" y="141" class="head" text-anchor="middle">Replica</text><text x="950" y="169" class="sub" text-anchor="middle">读取并执行复制流</text><text x="950" y="191" class="sub" text-anchor="middle">REPLCONF ACK &lt;offset&gt;</text></g><path d="M265 161L345 161" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="305" y="149" class="small" text-anchor="middle">写入</text><path d="M630 161L770 161" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="700" y="149" class="small" text-anchor="middle">replication stream</text><g><rect x="60" y="325" width="280" height="96" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="200" y="356" class="head" text-anchor="middle">WAIT 检查</text><text x="200" y="384" class="sub" text-anchor="middle">以本客户端最后写 offset</text><text x="200" y="406" class="sub" text-anchor="middle">比较在线副本 ACK</text></g><g><rect x="450" y="325" width="315" height="96" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="607.5" y="356" class="head" text-anchor="middle">ACK 更新</text><text x="607.5" y="384" class="sub" text-anchor="middle">repl_ack_off / repl_ack_time</text><text x="607.5" y="406" class="sub" text-anchor="middle">主节点记录已处理位置</text></g><g><rect x="880" y="325" width="235" height="96" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="997.5" y="356" class="head" text-anchor="middle">客户端结果</text><text x="997.5" y="384" class="sub" text-anchor="middle">达到数量 / 超时</text><text x="997.5" y="406" class="sub" text-anchor="middle">整数：已确认副本数</text></g><path d="M925 213L925 282L607 282L607 319" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="775" y="273" class="small" text-anchor="middle">ACK 回来</text><path d="M450 370L345 370" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M765 370L875 370" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="820" y="358" class="small" text-anchor="middle">门槛判断</text><text x="32" y="550" font-size="13" fill="#6c817c">注意：WAIT 不把 Redis 复制改造成强一致/磁盘持久化事务。</text></svg>