<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c26tx-t c26tx-d"><title id="c26tx-t">脚本、函数与 MULTI/EXEC 的三种生命周期</title><desc id="c26tx-d">EVAL 脚本缓存易失；Redis Functions 是命名库并持久化/复制；MULTI 则在客户端 multiState 中暂存命令，EXEC 时串行执行，WATCH 在提交前检查键是否变化。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="40" y="100" width="320" height="105" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="200" y="131" class="head" text-anchor="middle">EVAL / EVALSHA</text><text x="200" y="159" class="sub" text-anchor="middle">客户端拥有源码</text><text x="200" y="181" class="sub" text-anchor="middle">SHA 缓存易失</text></g><g><rect x="440" y="100" width="320" height="105" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="600" y="131" class="head" text-anchor="middle">FUNCTION / FCALL</text><text x="600" y="159" class="sub" text-anchor="middle">服务器管理库和函数名</text><text x="600" y="181" class="sub" text-anchor="middle">RDB / AOF / replication</text></g><g><rect x="840" y="100" width="320" height="105" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="1000" y="131" class="head" text-anchor="middle">MULTI / EXEC</text><text x="1000" y="159" class="sub" text-anchor="middle">客户端 mstate 命令队列</text><text x="1000" y="181" class="sub" text-anchor="middle">EXEC 期间不交错</text></g><g><rect x="55" y="320" width="290" height="100" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="200" y="351" class="head" text-anchor="middle">脚本执行</text><text x="200" y="379" class="sub" text-anchor="middle">逻辑分支 + Redis 命令</text><text x="200" y="401" class="sub" text-anchor="middle">运行时错误不回滚</text></g><g><rect x="455" y="320" width="290" height="100" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="600" y="351" class="head" text-anchor="middle">函数执行</text><text x="600" y="379" class="sub" text-anchor="middle">稳定 API + 部署生命周期</text><text x="600" y="401" class="sub" text-anchor="middle">同样阻塞执行</text></g><g><rect x="855" y="320" width="290" height="100" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="1000" y="351" class="head" text-anchor="middle">WATCH + EXEC</text><text x="1000" y="379" class="sub" text-anchor="middle">键变化 → null array</text><text x="1000" y="401" class="sub" text-anchor="middle">队列错误 → EXECABORT</text></g><path d="M200 205L200 315" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M600 205L600 315" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M1000 205L1000 315" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="32" y="550" font-size="13" fill="#6c817c">三种机制都不能替代业务层的错误处理、幂等设计和持久化策略。</text></svg>