<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-hashpath desc-hashpath"><title id="title-hashpath">Hash 从 listpack 到 hashtable：由值大小与字段数触发</title><desc id="desc-hashpath">HSET 先尝试编码转换，再写入；大字段、大值、超字段阈值或容量安全约束都可触发转换。</desc><defs><marker id="arrow-hashpath" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-hashpath" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-hashpath)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">Hash 从 listpack 到 hashtable：由值大小与字段数触发</text><rect x="45" y="102" width="240" height="92" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="165" y="140" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">HSET user f v</text><text x="165" y="167" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">查找或创建 Hash</text><path d="M285 148L330 148" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-hashpath)"/><rect x="337" y="102" width="284" height="92" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="479" y="140" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">hashTypeTryConversion</text><text x="479" y="167" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">检查长度 / 数量 / 安全性</text><path d="M621 148L680 148" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-hashpath)"/><rect x="687" y="102" width="229" height="92" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="801.5" y="140" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">hashTypeSet</text><text x="801.5" y="167" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">按当前编码写入</text><rect x="75" y="281" width="342" height="90" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="246" y="319" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">LISTPACK</text><text x="246" y="345.8" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">小字段 / 小数量时紧凑存储</text><rect x="540" y="281" width="342" height="90" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="711" y="319" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">OBJ_ENCODING_HT</text><text x="711" y="345.8" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">dict 字段映射</text><path d="M421 327L535 327" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-hashpath)"/><text x="478" y="319" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">超过阈值</text><text x="48" y="428" fill="#557078" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">从 listpack 转 hashtable 是表示变换，不等于用户 HASH 类型改变；配置影响时机。</text></svg>