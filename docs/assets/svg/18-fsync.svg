<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="aof-fsync-title aof-fsync-desc"><title id="aof-fsync-title">AOF 的 write 与 fsync 是两个不同阶段</title><desc id="aof-fsync-desc">Redis 把写命令传播为 RESP 命令并追加到 AOF buffer；write 进入操作系统页缓存，fsync 策略决定何时要求持久化设备完成同步。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="40" y="140" width="180" height="105" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="130" y="171" class="head" text-anchor="middle">写命令</text><text x="130" y="198" class="sub" text-anchor="middle">call() 判定传播</text><text x="130" y="220" class="sub" text-anchor="middle">feedAppendOnlyFile</text></g><g><rect x="280" y="140" width="180" height="105" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="370" y="171" class="head" text-anchor="middle">aof_buf</text><text x="370" y="198" class="sub" text-anchor="middle">RESP 命令字节</text><text x="370" y="220" class="sub" text-anchor="middle">等待 flush</text></g><g><rect x="520" y="140" width="180" height="105" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="610" y="171" class="head" text-anchor="middle">write()</text><text x="610" y="198" class="sub" text-anchor="middle">写入文件描述符</text><text x="610" y="220" class="sub" text-anchor="middle">OS page cache</text></g><g><rect x="775" y="70" width="350" height="90" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="950" y="101" class="head" text-anchor="middle">always</text><text x="950" y="128" class="sub" text-anchor="middle">同步 fsync / 组提交</text><text x="950" y="150" class="sub" text-anchor="middle">更高延迟，较强确认语义</text></g><g><rect x="775" y="205" width="350" height="90" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="950" y="236" class="head" text-anchor="middle">everysec</text><text x="950" y="263" class="sub" text-anchor="middle">BIO 后台 fsync</text><text x="950" y="285" class="sub" text-anchor="middle">异步刷盘，存在未同步窗口</text></g><g><rect x="775" y="340" width="350" height="90" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="950" y="371" class="head" text-anchor="middle">no</text><text x="950" y="398" class="sub" text-anchor="middle">不主动 fsync</text><text x="950" y="420" class="sub" text-anchor="middle">由操作系统决定写回</text></g><path d="M220 192 L275 192" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M460 192 L515 192" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M700 192 L745 115" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="730" y="130" class="edge" text-anchor="middle">配置分支</text><path d="M700 192 L745 250" fill="none" stroke="#167e80" stroke-width="2.5" marker-end="url(#arr)"/><text x="735" y="235" class="edge" text-anchor="middle">配置分支</text><path d="M700 192 L745 385" fill="none" stroke="#71827f" stroke-width="2.5" marker-end="url(#arr)"/><text x="730" y="365" class="edge" text-anchor="middle">配置分支</text><text x="34" y="548" font-size="13" fill="#71827f">write 成功不等于介质已持久化；everysec 的实际丢失窗口受调度、磁盘和故障时刻影响。</text></svg>