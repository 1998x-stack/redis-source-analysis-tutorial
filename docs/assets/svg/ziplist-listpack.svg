<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title-packed desc-packed"><title id="title-packed">为什么 listpack 避开了 ziplist 的 prevlen 连锁更新</title><desc id="desc-packed">ziplist 每个 entry 记录前一个 entry 的长度，listpack 每个 entry 尾部记录自身编码长度，可从后往前定位</desc><defs><marker id="arrow-packed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-packed" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="460" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-packed)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">为什么 listpack 避开了 ziplist 的 prevlen 连锁更新</text><text x="40" y="111" font-size="20" font-weight="700" fill="#233d43" font-family="Arial,sans-serif">ziplist</text><rect x="75" y="147" width="126" height="85" rx="7" fill="#f6e8e2" stroke="#c98769"/><rect x="201" y="147" width="135" height="85" rx="7" fill="#f2f3ef" stroke="#a2b1a8"/><text x="138" y="191" text-anchor="middle" font-size="15" fill="#8a4d32" font-family="Arial,sans-serif">prevlen(A)</text><text x="267" y="191" text-anchor="middle" font-size="15" fill="#355057" font-family="Arial,sans-serif">entry B</text><rect x="365" y="147" width="126" height="85" rx="7" fill="#f6e8e2" stroke="#c98769"/><rect x="491" y="147" width="135" height="85" rx="7" fill="#f2f3ef" stroke="#a2b1a8"/><text x="428" y="191" text-anchor="middle" font-size="15" fill="#8a4d32" font-family="Arial,sans-serif">prevlen(B)</text><text x="557" y="191" text-anchor="middle" font-size="15" fill="#355057" font-family="Arial,sans-serif">entry C</text><rect x="655" y="147" width="126" height="85" rx="7" fill="#f6e8e2" stroke="#c98769"/><rect x="781" y="147" width="135" height="85" rx="7" fill="#f2f3ef" stroke="#a2b1a8"/><text x="718" y="191" text-anchor="middle" font-size="15" fill="#8a4d32" font-family="Arial,sans-serif">prevlen(C)</text><text x="847" y="191" text-anchor="middle" font-size="15" fill="#355057" font-family="Arial,sans-serif">entry D</text><text x="40" y="287" font-size="20" font-weight="700" fill="#233d43" font-family="Arial,sans-serif">listpack</text><rect x="75" y="309" width="163" height="77" rx="7" fill="#e6f3ed" stroke="#679b90"/><rect x="238" y="309" width="98" height="77" rx="7" fill="#eae9f7" stroke="#8a7ab7"/><text x="156" y="354" text-anchor="middle" font-size="15" fill="#23554f" font-family="Arial,sans-serif">entry A</text><text x="287" y="354" text-anchor="middle" font-size="14" fill="#61538f" font-family="Arial,sans-serif">backlen(A)</text><rect x="365" y="309" width="163" height="77" rx="7" fill="#e6f3ed" stroke="#679b90"/><rect x="528" y="309" width="98" height="77" rx="7" fill="#eae9f7" stroke="#8a7ab7"/><text x="446" y="354" text-anchor="middle" font-size="15" fill="#23554f" font-family="Arial,sans-serif">entry B</text><text x="577" y="354" text-anchor="middle" font-size="14" fill="#61538f" font-family="Arial,sans-serif">backlen(B)</text><rect x="655" y="309" width="163" height="77" rx="7" fill="#e6f3ed" stroke="#679b90"/><rect x="818" y="309" width="98" height="77" rx="7" fill="#eae9f7" stroke="#8a7ab7"/><text x="736" y="354" text-anchor="middle" font-size="15" fill="#23554f" font-family="Arial,sans-serif">entry C</text><text x="867" y="354" text-anchor="middle" font-size="14" fill="#61538f" font-family="Arial,sans-serif">backlen(C)</text><text x="52" y="430" font-size="13" fill="#536b6e" font-family="Arial,'Noto Sans CJK SC'">结构简化：这里省略了全局 header、encoding 和结尾标志；插入仍需搬移连续字节。</text></svg>