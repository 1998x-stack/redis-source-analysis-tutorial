<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="rdb-cow-title rdb-cow-desc"><title id="rdb-cow-title">BGSAVE 的 fork 与 Copy-on-Write</title><desc id="rdb-cow-desc">fork 后父子进程初始共享物理页；子进程按 fork 时刻的逻辑视图序列化，父进程继续服务写请求时，只有被修改的页才因 COW 复制。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="410" y="85" width="380" height="90" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="600" y="116" class="head" text-anchor="middle">fork() / redisFork()</text><text x="600" y="143" class="sub" text-anchor="middle">建立子进程的快照视图</text></g><g><rect x="85" y="275" width="420" height="125" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="295" y="306" class="head" text-anchor="middle">父进程：继续服务</text><text x="295" y="333" class="sub" text-anchor="middle">接收 SET / DEL / EXPIRE</text><text x="295" y="355" class="sub" text-anchor="middle">写到共享页 → 触发 COW</text></g><g><rect x="695" y="275" width="420" height="125" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="905" y="306" class="head" text-anchor="middle">子进程：RDB 序列化</text><text x="905" y="333" class="sub" text-anchor="middle">遍历 fork 时的数据视图</text><text x="905" y="355" class="sub" text-anchor="middle">写临时文件、校验、rename</text></g><path d="M510 175 L300 265" fill="none" stroke="#7561a9" stroke-width="2.5" marker-end="url(#arr)"/><text x="370" y="225" class="edge" text-anchor="middle">共享地址空间视图</text><path d="M690 175 L900 265" fill="none" stroke="#52799b" stroke-width="2.5" marker-end="url(#arr)"/><text x="820" y="225" class="edge" text-anchor="middle">只读快照视图</text><g><rect x="410" y="445" width="380" height="65" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="600" y="476" class="head" text-anchor="middle">被写脏的页面产生私有副本</text><text x="600" y="503" class="sub" text-anchor="middle">COW 成本由写入页分布决定</text></g><path d="M295 400 L480 440" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="380" y="428" class="edge" text-anchor="middle">父进程写入</text><text x="34" y="548" font-size="13" fill="#71827f">COW 不意味着 fork 时立刻复制整个数据集；实际成本受页面修改率、内存碎片和子进程运行时长影响。</text></svg>