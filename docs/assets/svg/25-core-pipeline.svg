<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r25core-t r25core-d"><title id="r25core-t">从崩溃现场到符号化调用栈</title><desc id="r25core-d">包含匹配版本的 ELF 和 debug symbols、core 文件、配置及信号上下文时，可用 gdb 稳定还原调用帧；生产 core 可能包含隐私和内存敏感数据。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="65" y="115" width="290" height="110" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="210" y="146" class="head" text-anchor="middle">崩溃现场</text><text x="210" y="174" class="sub" text-anchor="middle">Redis 日志 / signal / PID</text><text x="210" y="196" class="sub" text-anchor="middle">系统 coredump 策略</text></g><g><rect x="455" y="115" width="290" height="110" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="600" y="146" class="head" text-anchor="middle">Core 文件</text><text x="600" y="174" class="sub" text-anchor="middle">core_pattern / ulimit</text><text x="600" y="196" class="sub" text-anchor="middle">可能不存在或不完整</text></g><g><rect x="845" y="115" width="290" height="110" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="990" y="146" class="head" text-anchor="middle">同版本可执行文件</text><text x="990" y="174" class="sub" text-anchor="middle">Redis 7.2.4 + debug symbols</text><text x="990" y="196" class="sub" text-anchor="middle">构建参数/依赖一致</text></g><path d="M355 170L450 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M745 170L840 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="315" y="335" width="570" height="108" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="600" y="366" class="head" text-anchor="middle">gdb ./src/redis-server corefile</text><text x="600" y="394" class="sub" text-anchor="middle">bt full / thread apply all bt / info registers</text><text x="600" y="416" class="sub" text-anchor="middle">定位崩溃地址、线程、函数参数</text></g><path d="M600 225L600 330" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="680" y="276" class="small" text-anchor="middle">符号化</text><g><rect x="390" y="475" width="420" height="58" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="600" y="506" class="head" text-anchor="middle">构造最小复现并隔离修复</text><text x="600" y="534" class="sub" text-anchor="middle">禁止传播 core 或含密码的数据</text></g><text x="32" y="550" font-size="13" fill="#6c817c">DEBUG SEGFAULT / SIGSEGV 是破坏性实验，只可在明确隔离、无真实数据的环境里使用。</text></svg>