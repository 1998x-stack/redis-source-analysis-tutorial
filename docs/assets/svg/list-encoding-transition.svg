<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-list-conv desc-list-conv"><title id="title-list-conv">List 体量变化会改变编码，不只是 push/pop 一条路径</title><desc id="desc-list-conv">7.2.4 新 List 先创建 listpack；增长可能转 quicklist；收缩后满足条件又可能转回 listpack。</desc><defs><marker id="arrow-list-conv" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-list-conv" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-list-conv)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">List 体量变化会改变编码，不只是 push/pop 一条路径</text><rect x="58" y="105" width="264" height="100" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="190" y="143" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">createListListpackObject</text><text x="190" y="170" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">LPUSH 新键先创建 listpack</text><path d="M322 155L389 155" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-list-conv)"/><text x="355.5" y="147" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">达到上限</text><rect x="399" y="105" width="270" height="100" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="534" y="143" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">listTypeTryConversionAppend</text><text x="534" y="170" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">检查增长前的大小</text><path d="M668 155L732 155" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-list-conv)"/><rect x="738" y="105" width="175" height="100" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="825.5" y="143" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">QUICKLIST</text><text x="825.5" y="170" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">分段节点</text><rect x="337" y="308" width="285" height="92" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="479.5" y="346" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">缩小时的转换判定</text><text x="479.5" y="373" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">单 packed node + 滞回阈值</text><path d="M823 207L623 299" stroke="#53736f" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-list-conv)"/><text x="723" y="245" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">SHRINKING</text><path d="M334 352L194 223" stroke="#53736f" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-list-conv)"/><text x="264" y="279.5" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">可回到 listpack</text><text x="54" y="438" fill="#557078" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">注意：这里是转换条件图；删除单个元素并不保证每次立刻“降级”。</text></svg>