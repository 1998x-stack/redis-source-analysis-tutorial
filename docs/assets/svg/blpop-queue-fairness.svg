<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-blocked-fairness desc-blocked-fairness"><title id="title-blocked-fairness">同一个键的阻塞队列：先等待的客户端先被尝试服务</title><desc id="desc-blocked-fairness">同一 key 的等待队列用链表保存；可用元素不足时不保证所有等待客户端都得到值。</desc><defs><marker id="arrow-blocked-fairness" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-blocked-fairness" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-blocked-fairness)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">同一个键的阻塞队列：先等待的客户端先被尝试服务</text><rect x="48" y="99" width="240" height="90" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="168" y="137" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">blocking_keys['work']</text><text x="168" y="163.8" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">list of waiting clients</text><rect x="335" y="112" width="156" height="67" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="413" y="142.15" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">client A</text><text x="413" y="160.24" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">wait #1</text><rect x="525" y="112" width="156" height="67" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="603" y="142.15" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">client B</text><text x="603" y="160.24" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">wait #2</text><rect x="715" y="112" width="156" height="67" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="793" y="142.15" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">client C</text><text x="793" y="160.24" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">wait #3</text><path d="M288 145L328 145" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked-fairness)"/><path d="M492 145L518 145" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked-fairness)"/><path d="M682 145L709 145" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked-fairness)"/><rect x="57" y="293" width="280" height="85" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="197" y="331" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">LPUSH work job1</text><text x="197" y="354.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">仅新增一个可取元素</text><path d="M341 335L416 335" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-blocked-fairness)"/><rect x="422" y="293" width="382" height="85" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="613" y="331" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">优先尝试 client A</text><text x="613" y="354.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">被取走后 B、C 继续等待</text><text x="52" y="428" fill="#557078" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">Redis 处理的是 key-ready 队列，而不是给每个消费者保留一条消息；不同键 / 模块会改变具体路径。</text></svg>