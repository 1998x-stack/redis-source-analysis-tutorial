<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title-frames desc-frames"><title id="title-frames">GDB 观察到的调用栈与入口点</title><desc id="desc-frames">main 进入 aeMain，网络读事件回调处理请求，再转入 processCommand 与具体命令实现</desc><defs><marker id="arrow-frames" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-frames" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="420" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="420" fill="url(#dots-frames)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">GDB 观察到的调用栈与入口点</text><rect x="63" y="84" width="372" height="66" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="249" y="113" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">main</text><text x="249" y="138" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">server.c</text><rect x="63" y="168" width="372" height="66" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="249" y="197" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">aeMain / aeProcessEvents</text><text x="249" y="222" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">ae.c</text><rect x="63" y="252" width="372" height="66" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="249" y="281" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">readQueryFromClient</text><text x="249" y="306" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="1