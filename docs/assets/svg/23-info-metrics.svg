<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r23info-t r23info-d"><title id="r23info-t">INFO 指标：累计计数器、瞬时速率与状态快照</title><desc id="r23info-d">INFO stats 的 total_commands_processed 为累计计数，instantaneous_ops_per_sec 为窗口估计；memory/persistence/replication 更多是状态与事件快照；应做差分和关联。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="90" y="105" width="320" height="103" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="250" y="136" class="head" text-anchor="middle">累计 Counter</text><text x="250" y="164" class="sub" text-anchor="middle">total_commands_processed</text><text x="250" y="186" class="sub" text-anchor="middle">expired_keys / evicted_keys</text></g><g><rect x="455" y="105" width="320" height="103" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="615" y="136" class="head" text-anchor="middle">速率 Gauge</text><text x="615" y="164" class="sub" text-anchor="middle">instantaneous_ops_per_sec</text><text x="615" y="186" class="sub" text-anchor="middle">serverCron 统计窗口</text></g><g><rect x="820" y="105" width="300" height="103" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="970" y="136" class="head" text-anchor="middle">状态 Snapshot</text><text x="970" y="164" class="sub" text-anchor="middle">used_memory / rdb_bgsave</text><text x="970" y="186" class="sub" text-anchor="middle">master_link_status</text></g><g><rect x="65" y="330" width="340" height="98" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="235" y="361" class="head" text-anchor="middle">两个时间点差分</text><text x="235" y="389" class="sub" text-anchor="middle">Δcounter / Δtime</text><text x="235" y="411" class="sub" text-anchor="middle">找突增和转折</text></g><g><rect x="430" y="330" width="340" height="98" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="600" y="361" class="head" text-anchor="middle">窗口内估计</text><text x="600" y="389" class="sub" text-anchor="middle">不能当作绝对事件数</text><text x="600" y="411" class="sub" text-anchor="middle">负载跳变需结合采样周期</text></g><g><rect x="795" y="330" width="340" height="98" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="965" y="361" class="head" text-anchor="middle">解释状态因果</text><text x="965" y="389" class="sub" text-anchor="middle">状态变化与日志关联</text><text x="965" y="411" class="sub" text-anchor="middle">不能只看一次 INFO</text></g><path d="M250 208L235 324" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M615 208L600 324" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M970 208L965 324" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="32" y="550" font-size="13" fill="#6c817c">对比指标前应确认相同主机、相同实例、相同采样窗口及 INFO 字段版本。</text></svg>