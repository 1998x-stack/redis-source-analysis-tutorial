<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-stream-tree d-stream-tree"><title id="t-stream-tree">Stream：128 位 ID、rax 分段索引与 listpack 记录</title><desc id="d-stream-tree">streamID 由毫秒部分与序列部分组成。rax 索引若干 listpack 节点，每个紧凑节点内包含多条 entry。</desc><defs><marker id="arr-stream-tree" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-stream-tree" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-stream-tree)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Stream：128 位 ID、rax 分段索引与 listpack 记录</text><rect x="35" y="85" width="287" height="92" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="178.5" y="122" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">XADD events * f v</text><text x="178.5" y="149" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">生成单调增长的 streamID</text><path d="M326 131L379 131" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-stream-tree)"/><rect x="388" y="85" width="252" height="92" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="514" y="122" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">stream.rax</text><text x="514" y="149" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">按 node master ID 组织</text><path d="M643 131L684 131" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-stream-tree)"/><rect x="693" y="85" width="234" height="92" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="810" y="122" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">listpack node</text><text x="810" y="149" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">多条 entry 紧凑存放</text><rect x="64" y="251" width="225" height="109" rx="10" fill="#e4f4ef" stroke="#167e80"/><text x="176" y="280" fill="#264148" font-size="15" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">1700000-0</text><text x="176" y="312" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">master fields + entries</text><text x="176" y="340" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">compressed listpack</text><rect x="365" y="251" width="225" height="109" rx="10" fill="#efecf8" stroke="#7864ae"/><text x="477" y="280" fill="#264148" font-size="15" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">1700001-0</text><text x="477" y="312" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">master fields + entries</text><text x="477" y="340" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">compressed listpack</text><rect x="667" y="251" width="225" height="109" rx="10" fill="#e4f4ef" stroke="#167e80"/><text x="779" y="280" fill="#264148" font-size="15" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">1700001-3</text><text x="779" y="312" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">master fields + entries</text><text x="779" y="340" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">compressed listpack</text><text x="42" y="415" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">图示节点示例，不代表每条 XADD 都创建一个新 listpack；真实 entry 使用 delta ID 与共享字段布局。</text></svg>