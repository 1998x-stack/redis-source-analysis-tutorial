<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c27load-t c27load-d"><title id="c27load-t">Redis Module 从 dlopen 到命令注册</title><desc id="c27load-d">moduleLoad 使用 dlopen/dlsym 找到 RedisModule_OnLoad；RedisModule_Init 通过 API 表绑定函数指针；OnLoad 中注册模块命令和自定义类型，完成后模块可接收命令。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="35" y="115" width="215" height="110" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="142.5" y="146" class="head" text-anchor="middle">MODULE LOAD</text><text x="142.5" y="174" class="sub" text-anchor="middle">或启动配置 loadmodule</text><text x="142.5" y="196" class="sub" text-anchor="middle">路径与依赖检查</text></g><g><rect x="295" y="115" width="215" height="110" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="402.5" y="146" class="head" text-anchor="middle">dlopen / dlsym</text><text x="402.5" y="174" class="sub" text-anchor="middle">找到 RedisModule_OnLoad</text><text x="402.5" y="196" class="sub" text-anchor="middle">创建临时 Module Context</text></g><g><rect x="555" y="115" width="250" height="110" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="680" y="146" class="head" text-anchor="middle">RedisModule_Init</text><text x="680" y="174" class="sub" text-anchor="middle">API version / module name</text><text x="680" y="196" class="sub" text-anchor="middle">函数指针从 API 表绑定</text></g><g><rect x="850" y="115" width="315" height="110" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="1007.5" y="146" class="head" text-anchor="middle">RedisModule_OnLoad</text><text x="1007.5" y="174" class="sub" text-anchor="middle">CreateCommand / CreateDataType</text><text x="1007.5" y="196" class="sub" text-anchor="middle">初始化配置与资源</text></g><path d="M250 170L290 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M510 170L550 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M805 170L845 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="245" y="350" width="290" height="95" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="390" y="381" class="head" text-anchor="middle">命令回调</text><text x="390" y="409" class="sub" text-anchor="middle">ctx / argv / argc</text><text x="390" y="431" class="sub" text-anchor="middle">主线程执行</text></g><g><rect x="665" y="350" width="290" height="95" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="810" y="381" class="head" text-anchor="middle">数据类型回调</text><text x="810" y="409" class="sub" text-anchor="middle">RDB / AOF / digest / free</text><text x="810" y="431" class="sub" text-anchor="middle">与数据生命周期绑定</text></g><path d="M1005 225L1005 290L390 290L390 345" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="670" y="278" class="small" text-anchor="middle">命令表</text><path d="M1005 225L1005 290L810 290L810 345" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="910" y="278" class="small" text-anchor="middle">type methods</text><text x="32" y="550" font-size="13" fill="#6c817c">Module 是同进程原生代码，不是隔离沙箱；加载不可信模块等同加载不可信本地程序。</text></svg>