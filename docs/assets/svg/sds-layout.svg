<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title-sds desc-sds"><title id="title-sds">SDS header 与二进制安全布局（sdshdr8）</title><desc id="desc-sds">sdshdr8 的 len、alloc、flags 排在 buf 前，buf 含 0 字节的数据不影响 sdslen，末尾仍保留兼容 NUL</desc><defs><marker id="arrow-sds" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-sds" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="420" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="420" fill="url(#dots-sds)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">SDS header 与二进制安全布局（sdshdr8）</text><g font-family="Arial,'Noto Sans CJK SC',sans-serif"><rect x="68" y="146" width="130" height="100" rx="7" fill="#ece9f7" stroke="#8271b5" stroke-width="2"/><rect x="198" y="146" width="130" height="100" rx="7" fill="#ece9f7" stroke="#8271b5" stroke-width="2"/><rect x="328" y="146" width="130" height="100" rx="7" fill="#ece9f7" stroke="#8271b5" stroke-width="2"/><rect x="458" y="146" width="82" height="100" rx="7" fill="#e1f1ea" stroke="#509889" stroke-width="2"/><rect x="540" y="146" width="82" height="100" rx="7" fill="#e1f1ea" stroke="#509889" stroke-width="2"/><rect x="622" y="146" width="82" height="100" rx="7" fill="#e1f1ea" stroke="#509889" stroke-width="2"/><rect x="704" y="146" width="82" height="100" rx="7" fill="#f8ece5" stroke="#ca8160" stroke-width="2"/></g><text x="131" y="187" fill="#234146" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">len</text><text x="131" y="216" fill="#5c6d71" text-anchor="middle" font-size="14" font-family="Arial,sans-serif">3</text><text x="261" y="187" fill="#234146" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">alloc</text><text x="261" y="216" fill="#5c6d71" text-anchor="middle" font-size="14" font-family="Arial,sans-serif">3</text><text x="391" y="187" fill="#234146" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">flags</text><text x="391" y="216" fill="#5c6d71" text-anchor="middle" font-size="14" font-family="Arial,sans-serif">type8</text><text x="499" y="187" fill="#234146" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">a</text><text x="499" y="216" fill="#5c6d71" text-anchor="middle" font-size="14" font-family="Arial,sans-serif">61</text><text x="581" y="187" fill="#234146" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">\\0</text><text x="581" y="216" fill="#5c6d71" text-anchor="middle" font-size="14" font-family="Arial,sans-serif">00</text><text x="663" y="187" fill="#234146" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">b</text><text x="663" y="216" fill="#5c6d71" text-anchor="middle" font-size="14" font-family="Arial,sans-serif">62</text><text x="745" y="187" fill="#234146" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">\\0</text><text x="745" y="216" fill="#5c6d71" text-anchor="middle" font-size="14" font-family="Arial,sans-serif">00</text><path d="M459 273V300H500" stroke="#25877c" stroke-width="2.5" fill="none"/><text x="508" y="306" font-size="16" font-weight="700" fill="#28786e" font-family="Arial,sans-serif">s → buf[0]</text><text x="81" y="114" fill="#70619b" font-size="15" font-family="Arial,'Noto Sans CJK SC'">头部 (3 bytes)</text><text x="488" y="114" fill="#2b8276" font-size="15" font-family="Arial,'Noto Sans CJK SC'">数据 3 bytes</text><text x="731" y="114" fill="#bc7958" font-size="15" font-family="Arial,'Noto Sans CJK SC'">终止符</text><text x="65" y="379" fill="#4e676b" font-size="14" font-family="Arial,'Noto Sans CJK SC'">示意值: sdsnewlen("a\\0b", 3)。缓冲区可含内嵌 0，逻辑长度由 len 决定。</text></svg>