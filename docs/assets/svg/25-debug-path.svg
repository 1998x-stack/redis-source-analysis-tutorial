<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r25call-t r25call-d"><title id="r25call-t">GDB 断点定位一次 SET 的执行链</title><desc id="r25call-d">redis-cli 的 SET 经过 networking.c 输入解析、server.c processCommand/call、t_string.c setCommand 以及 DB 写入，再回到客户端回复缓冲和 IO 写出。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="30" y="115" width="218" height="114" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="139" y="146" class="head" text-anchor="middle">networking.c</text><text x="139" y="174" class="sub" text-anchor="middle">readQueryFromClient</text><text x="139" y="196" class="sub" text-anchor="middle">processInputBuffer</text></g><g><rect x="290" y="115" width="218" height="114" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="399" y="146" class="head" text-anchor="middle">server.c</text><text x="399" y="174" class="sub" text-anchor="middle">processCommand</text><text x="399" y="196" class="sub" text-anchor="middle">lookup + guard</text></g><g><rect x="550" y="115" width="218" height="114" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="659" y="146" class="head" text-anchor="middle">server.c</text><text x="659" y="174" class="sub" text-anchor="middle">call / c-&gt;cmd-&gt;proc</text><text x="659" y="196" class="sub" text-anchor="middle">dirty / slowlog</text></g><g><rect x="810" y="115" width="345" height="114" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="982.5" y="146" class="head" text-anchor="middle">t_string.c / db.c</text><text x="982.5" y="174" class="sub" text-anchor="middle">setCommand → setGenericCommand</text><text x="982.5" y="196" class="sub" text-anchor="middle">dbAdd / setKey / signalModifiedKey</text></g><path d="M248 169L285 169" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M508 169L545 169" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M768 169L805 169" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="180" y="325" width="365" height="93" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="362.5" y="356" class="head" text-anchor="middle">断点 1：processCommand</text><text x="362.5" y="384" class="sub" text-anchor="middle">检查 c-&gt;argc、c-&gt;argv[0]</text><text x="362.5" y="406" class="sub" text-anchor="middle">发生在查找/ACL/执行前</text></g><g><rect x="650" y="325" width="365" height="93" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="832.5" y="356" class="head" text-anchor="middle">断点 2：setCommand</text><text x="832.5" y="384" class="sub" text-anchor="middle">检验 key/value 和调用栈</text><text x="832.5" y="406" class="sub" text-anchor="middle">观察内部具体分支</text></g><path d="M395 229L395 319" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="440" y="279" class="small" text-anchor="middle">gdb break</text><path d="M985 229L985 290L835 290L835 319" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="935" y="280" class="small" text-anchor="middle">gdb break</text><text x="32" y="550" font-size="13" fill="#6c817c">生产实例慎用 ptrace 停止线程；调试应在独立 Redis 7.2.4 二进制和隔离端口上执行。</text></svg>