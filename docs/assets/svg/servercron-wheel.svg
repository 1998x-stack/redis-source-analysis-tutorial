<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-cron d-cron"><title id="t-cron">serverCron：频率是预算入口，不是所有任务都按 hz 执行</title><desc id="d-cron">serverCron 是由 aeTimeEvent 驱动的周期回调；它可根据 dynamic-hz 调整频率，内部任务可能使用 run_with_period 降频。</desc><defs><marker id="arr-cron" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-cron" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-cron)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">serverCron：频率是预算入口，不是所有任务都按 hz 执行</text><rect x="27" y="94" width="256" height="89" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="155" y="131" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">config_hz / dynamic_hz</text><text x="155" y="158" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">hz 高并不代表所有任务更快</text><path d="M284 139L326 139" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-cron)"/><rect x="336" y="94" width="270" height="89" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="471" y="131" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">serverCron callback</text><text x="471" y="158" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">事件循环中执行</text><path d="M607 139L650 139" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-cron)"/><rect x="658" y="94" width="276" height="89" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="796" y="131" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">return 1000 / hz</text><text x="796" y="158" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">作为下一次延迟</text><rect x="38" y="298" width="262" height="84" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="169" y="335" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">周期统计与 LRU 时钟</text><text x="169" y="360.15999999999997" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">不同任务独立节奏</text><rect x="345" y="298" width="262" height="84" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="476" y="335" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">过期 / 客户端状态</text><text x="476" y="360.15999999999997" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">按预算维护</text><rect x="651" y="298" width="266" height="84" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="784" y="335" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">BGSAVE / 复制等</text><text x="784" y="360.15999999999997" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">按状态检查与调度</text><text x="48" y="425" fill="#587277" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">调大 hz 不能替代减少长命令阻塞、修正磁盘 I/O 或解决客户端输出缓冲积压。</text></svg>