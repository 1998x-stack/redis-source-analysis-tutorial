<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-zadd d-zadd"><title id="t-zadd">ZADD 从命令约束到 listpack / skiplist 两条路径</title><desc id="d-zadd">zaddGenericCommand 解析条件与分数，zsetAdd 基于编码执行；skiplist 编码还维护成员字典。</desc><defs><marker id="arr-zadd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-zadd" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-zadd)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ZADD 从命令约束到 listpack / skiplist 两条路径</text><rect x="31" y="89" width="214" height="84" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="138" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ZADD k NX 2 foo</text><text x="138" y="151.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">NX/XX/GT/LT/CH/INCR</text><path d="M246 131L286 131" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-zadd)"/><rect x="295" y="89" width="275" height="84" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="432.5" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">zaddGenericCommand</text><text x="432.5" y="151.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">解析标志和分数</text><path d="M570 131L611 131" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-zadd)"/><rect x="621" y="89" width="308" height="84" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="775" y="126" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">zsetAdd</text><text x="775" y="151.16" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">更新、增加或拒绝</text><path d="M713 175L320 258" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-zadd)"/><path d="M828 175L750 258" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-zadd)"/><rect x="145" y="273" width="315" height="91" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="302.5" y="310" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">LISTPACK</text><text x="302.5" y="337" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">查找、替换紧凑 entry</text><rect x="546" y="273" width="336" height="91" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="714" y="310" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SKIPLIST</text><text x="714" y="337" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">dict：按成员查分数；zsl：保持秩</text><text x="49" y="413" fill="#587277" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">失败条件不增加新元素；CH 会改变返回值的计数口径，INCR 则返回分数。</text></svg>