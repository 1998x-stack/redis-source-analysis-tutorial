<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-zset-indices desc-zset-indices"><title id="title-zset-indices">ZSET 的双索引只属于 SKIPLIST 编码</title><desc id="desc-zset-indices">压缩的小 ZSET 可直接用 listpack；切到 SKIPLIST 后有 dict 按 member 找分数，skiplist 按 score 排序。</desc><defs><marker id="arrow-zset-indices" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-zset-indices" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-zset-indices)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">ZSET 的双索引只属于 SKIPLIST 编码</text><rect x="43" y="101" width="225" height="96" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="155.5" y="139" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ZADD member score</text><text x="155.5" y="166" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">调用 zaddGenericCommand</text><path d="M269 151L331 151" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-zset-indices)"/><rect x="335" y="101" width="262" height="96" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="466" y="139" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">当前 OBJ_ENCODING</text><text x="466" y="166" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">LISTPACK / SKIPLIST</text><path d="M599 151L668 151" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-zset-indices)"/><rect x="671" y="101" width="255" height="96" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="798.5" y="139" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">更新路径</text><text x="798.5" y="166" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">编码决定实现</text><rect x="49" y="287" width="379" height="88" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="238.5" y="325" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">LISTPACK</text><text x="238.5" y="350.36" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">紧凑交替保存 member / score</text><rect x="515" y="287" width="395" height="88" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="712.5" y="325" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SKIPLIST</text><text x="712.5" y="350.36" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">zset{dict, zsl} 两个一致索引</text><path d="M461 200L226 275" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-zset-indices)"/><path d="M576 200L716 275" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-zset-indices)"/><text x="53" y="420" fill="#557078" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">同一 ZSET key 不应被误画成同时持有 listpack、dict 与 skiplist 三份独立值。</text></svg>