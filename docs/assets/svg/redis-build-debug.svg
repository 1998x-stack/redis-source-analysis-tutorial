<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title-build desc-build"><title id="title-build">从固定源码到可追踪的命令执行</title><desc id="desc-build">版本锁定 → 清理构建 → 编译带调试符号 → 两终端启动客户端与调试器 → GDB 命中断点</desc><defs><marker id="arrow-build" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-build" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="420" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="420" fill="url(#dots-build)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">从固定源码到可追踪的命令执行</text><rect x="31" y="132" width="168" height="82" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="115" y="166" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">固定 tag</text><text x="115" y="191" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">git checkout 7.2.4</text><rect x="224" y="132" width="170" height="82" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="309" y="166" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">清理依赖</text><text x="309" y="191" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">make distclean</text><rect x="421" y="132" width="170" height="82" rx="12" fill="#f7eee7" stroke="#c78361" stroke-width="1.8"/><text x="506" y="166" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">重新编译</text><text x="506" y="191" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">-O0 -g3 MALLOC=libc</text><rect x="617" y="132" width="143" height="82" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="688.5" y="166" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">GDB 启动</text><text x="688.5" y="191" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">break processCommand</text><rect x="783" y="132" width="145" height="82" rx="12" fill="#e8f4ef" stroke="#5b9c8c" stroke-width="1.8"/><text x="855.5" y="166" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">客户端</text><text x="855.5" y="191" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">redis-cli SET k v</text><path d="M199 173 L214 173" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-build)"/><path d="M394 173 L411 173" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-build)"/><path d="M591 173 L607 173" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-build)"/><path d="M760 173 L773 173" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-build)"/><rect x="330" y="288" width="315" height="72" rx="12" fill="#eceaf6" stroke="#8272b5" stroke-width="1.8"/><text x="487.5" y="320" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">验收条件</text><text x="487.5" y="345" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">断点命中 argv=SET / key / v</text><path d="M689 216 L624 279" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-build)"/><text x="35" y="390" font-size="14" fill="#49666a" font-family="Arial,'Noto Sans CJK SC'">命令在两终端启动。断点命中依赖实际调试符号、正确二进制及输入路径。</text></svg>