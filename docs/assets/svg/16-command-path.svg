<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="cmd-path-title cmd-path-desc"><title id="cmd-path-title">Redis 命令执行主路径</title><desc id="cmd-path-desc">RESP 请求经过输入缓冲和命令解析后，进入 processCommand 的查找与前置检查；MULTI 命令排队，普通命令进入 call 并执行命令处理器。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="35" y="130" width="160" height="112" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="115" y="161" class="head" text-anchor="middle">RESP 请求</text><text x="115" y="188" class="sub" text-anchor="middle">命令名 + 参数</text><text x="115" y="210" class="sub" text-anchor="middle">网络输入已组帧</text></g><g><rect x="235" y="130" width="170" height="112" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="320" y="161" class="head" text-anchor="middle">解析 argv</text><text x="320" y="188" class="sub" text-anchor="middle">querybuf / RESP</text><text x="320" y="210" class="sub" text-anchor="middle">networking.c</text></g><g><rect x="445" y="130" width="185" height="112" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="537.5" y="161" class="head" text-anchor="middle">processCommand</text><text x="537.5" y="188" class="sub" text-anchor="middle">lookup + arity</text><text x="537.5" y="210" class="sub" text-anchor="middle">auth / ACL / flags</text></g><g><rect x="675" y="130" width="180" height="112" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="765" y="161" class="head" text-anchor="middle">执行分支</text><text x="765" y="188" class="sub" text-anchor="middle">CLIENT_MULTI?</text><text x="765" y="210" class="sub" text-anchor="middle">queue 或 call()</text></g><g><rect x="900" y="130" width="250" height="112" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="1025" y="161" class="head" text-anchor="middle">命令处理器</text><text x="1025" y="188" class="sub" text-anchor="middle">c-&gt;cmd-&gt;proc(c)</text><text x="1025" y="210" class="sub" text-anchor="middle">读写数据结构并构造回复</text></g><path d="M195 186 L230 186" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M405 186 L440 186" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M630 186 L670 186" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M855 186 L895 186" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="220" y="340" width="230" height="105" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="335" y="371" class="head" text-anchor="middle">事务队列</text><text x="335" y="398" class="sub" text-anchor="middle">queueMultiCommand()</text><text x="335" y="420" class="sub" text-anchor="middle">返回 QUEUED</text></g><g><rect x="520" y="340" width="250" height="105" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="645" y="371" class="head" text-anchor="middle">call() 收尾</text><text x="645" y="398" class="sub" text-anchor="middle">dirty 差值 / latency</text><text x="645" y="420" class="sub" text-anchor="middle">slowlog / commandstats</text></g><g><rect x="850" y="340" width="280" height="105" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="990" y="371" class="head" text-anchor="middle">副作用传播</text><text x="990" y="398" class="sub" text-anchor="middle">alsoPropagate → AOF / REPL</text><text x="990" y="420" class="sub" text-anchor="middle">回复仍在 client buffer</text></g><path d="M765 243 L765 290 L335 290 L335 335" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="520" y="282" class="edge" text-anchor="middle">MULTI 分支</text><path d="M1015 243 L1015 290 L645 290 L645 335" fill="none" stroke="#167e80" stroke-width="2.5" marker-end="url(#arr)"/><text x="830" y="282" class="edge" text-anchor="middle">普通命令</text><path d="M450 392 L515 392" fill="none" stroke="#c36b45" stroke-width="2.7" marker-end="url(#arr)"/><text x="482.5" y="382" class="edge" text-anchor="middle">EXEC 后</text><path d="M770 392 L845 392" fill="none" stroke="#7561a9" stroke-width="2.7" marker-end="url(#arr)"/><text x="807.5" y="382" class="edge" text-anchor="middle">执行单元结束</text><text x="34" y="548" font-size="13" fill="#71827f">这是执行层的结构示意；具体检查项受命令 flags、客户端状态、模块与集群配置影响。</text></svg>