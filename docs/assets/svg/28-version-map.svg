<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c28version-t c28version-d"><title id="c28version-t">Redis 7.2 到 Redis 8.10：版本与发行边界</title><desc id="c28version-d">7.2.x 使用 BSD-3-Clause；7.4.x 使用 RSALv2/SSPLv1；Redis 8 增加 AGPLv3 选项并将 Stack 能力纳入发行包。2026-11-23 最新 GA 补丁为 8.10.3，8.12-RC3 仍是预发布。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="35" y="130" width="200" height="120" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="135" y="161" class="head" text-anchor="middle">Redis 7.2.x</text><text x="135" y="189" class="sub" text-anchor="middle">BSD-3-Clause</text><text x="135" y="211" class="sub" text-anchor="middle">课程固定源码 7.2.4</text></g><g><rect x="275" y="130" width="200" height="120" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="375" y="161" class="head" text-anchor="middle">Redis 7.4.x</text><text x="375" y="189" class="sub" text-anchor="middle">RSALv2 / SSPLv1</text><text x="375" y="211" class="sub" text-anchor="middle">Hash field expiration</text></g><g><rect x="515" y="130" width="200" height="120" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="615" y="161" class="head" text-anchor="middle">Redis 8.0+</text><text x="615" y="189" class="sub" text-anchor="middle">RSALv2 / SSPLv1 / AGPLv3</text><text x="615" y="211" class="sub" text-anchor="middle">Search / JSON / TS / Bloom</text></g><g><rect x="755" y="130" width="200" height="120" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="855" y="161" class="head" text-anchor="middle">Redis 8.10.3</text><text x="855" y="189" class="sub" text-anchor="middle">GA 最新补丁</text><text x="855" y="211" class="sub" text-anchor="middle">Compact Hash / HIMPORT / BACKUP</text></g><g><rect x="995" y="130" width="170" height="120" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="1080" y="161" class="head" text-anchor="middle">8.12-RC3</text><text x="1080" y="189" class="sub" text-anchor="middle">预发布</text><text x="1080" y="211" class="sub" text-anchor="middle">不用于生产</text></g><path d="M235 190L270 190" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M475 190L510 190" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M715 190L750 190" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M955 190L990 190" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="300" y="365" width="600" height="95" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="600" y="396" class="head" text-anchor="middle">能力打包 ≠ 所有代码变成 core 命令</text><text x="600" y="424" class="sub" text-anchor="middle">Redis 8 发行树仍包含模块源码、构建清单和运行时 loadmodule</text></g><text x="32" y="550" font-size="13" fill="#6c817c">版本状态以 2026-11-23 官方发行目录、支持版本表和 release notes 为准。</text></svg>