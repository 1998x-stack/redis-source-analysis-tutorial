<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="active-expire-title active-expire-desc"><title id="active-expire-title">主动过期是带预算的增量抽样循环</title><desc id="active-expire-desc">activeExpireCycle 在 expires 字典中分批抽样，统计样本与过期比率；fast/slow 模式和 active-expire-effort 调整预算，超时后跨调用继续。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="45" y="125" width="205" height="110" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="147.5" y="156" class="head" text-anchor="middle">expires 字典</text><text x="147.5" y="183" class="sub" text-anchor="middle">只含有 TTL 的 key</text><text x="147.5" y="205" class="sub" text-anchor="middle">cursor 跨调用推进</text></g><g><rect x="325" y="125" width="205" height="110" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="427.5" y="156" class="head" text-anchor="middle">抽样扫描</text><text x="427.5" y="183" class="sub" text-anchor="middle">每轮抽样若干 key</text><text x="427.5" y="205" class="sub" text-anchor="middle">activeExpireCycleTryExpire</text></g><g><rect x="605" y="125" width="205" height="110" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="707.5" y="156" class="head" text-anchor="middle">判断 stale ratio</text><text x="707.5" y="183" class="sub" text-anchor="middle">计算样本中过期比例</text><text x="707.5" y="205" class="sub" text-anchor="middle">估计剩余 TTL</text></g><g><rect x="885" y="125" width="265" height="110" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="1017.5" y="156" class="head" text-anchor="middle">预算控制</text><text x="1017.5" y="183" class="sub" text-anchor="middle">FAST / SLOW</text><text x="1017.5" y="205" class="sub" text-anchor="middle">CPU 时间百分比 / effort</text></g><path d="M250 180 L320 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M530 180 L600 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M810 180 L880 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="190" y="340" width="330" height="90" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="355" y="371" class="head" text-anchor="middle">继续本轮 / 下一轮</text><text x="355" y="398" class="sub" text-anchor="middle">超出时间预算就暂停并保留游标</text></g><g><rect x="680" y="340" width="330" height="90" rx="13" fill="#faecea" stroke="#b75d56" stroke-width="1.7"/><text x="845" y="371" class="head" text-anchor="middle">删除并传播</text><text x="845" y="398" class="sub" text-anchor="middle">统计 expired_keys</text><text x="845" y="420" class="sub" text-anchor="middle">DEL/UNLINK 进入执行单元传播</text></g><path d="M990 235 L990 295 L845 295 L845 335" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="900" y="285" class="edge" text-anchor="middle">过期比例 / 预算</text><path d="M710 235 L710 295 L355 295 L355 335" fill="none" stroke="#71827f" stroke-width="2.5" marker-end="url(#arr)"/><text x="520" y="285" class="edge" text-anchor="middle">未到期 / 达预算</text><text x="34" y="548" font-size="13" fill="#71827f">Redis 7.2.4 默认 effort=1；effort 可配置 1–10，不能据此承诺精确 TTL 回收时刻。</text></svg>