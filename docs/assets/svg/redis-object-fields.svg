<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-object-header desc-object-header"><title id="title-object-header">redisObject：类型、编码、热度与引用计数各管一层</title><desc id="desc-object-header">redisObject 的 type / encoding / lru 位域和 refcount / ptr 联合表示值的类型与物理编码；lru 字段也承载 LFU 数据。</desc><defs><marker id="arrow-object-header" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-object-header" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-object-header)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">redisObject：类型、编码、热度与引用计数各管一层</text><rect x="51" y="100" width="855" height="74" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="478.5" y="133.3" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">redisObject</text><text x="478.5" y="153.28" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">命令层的统一对象句柄</text><rect x="43" y="218" width="280" height="75" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="183" y="251.75" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">type : 4 bits</text><text x="183" y="272" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">String / List / Hash / ...</text><rect x="338" y="218" width="280" height="75" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="478" y="251.75" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">encoding : 4 bits</text><text x="478" y="272" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">int / embstr / ht / listpack ...</text><rect x="633" y="218" width="280" height="75" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="773" y="251.75" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">lru : 24 bits</text><text x="773" y="272" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">LRU clock 或 LFU payload</text><rect x="43" y="320" width="280" height="75" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="183" y="353.75" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">refcount</text><text x="183" y="374" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">正常计数 / 特殊共享标记</text><rect x="338" y="320" width="280" height="75" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="478" y="353.75" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ptr</text><text x="478" y="374" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">SDS / 整数 / 容器指针</text><text x="52" y="433" fill="#557078" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">不能根据 type == STRING 推断 ptr 一定指向 SDS：OBJ_ENCODING_INT 在指针位域存整数值。</text></svg>