<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c27type-t c27type-d"><title id="c27type-t">自定义 Module 数据类型的完整持久化生命周期</title><desc id="c27type-d">RedisModule_CreateDataType 在 OnLoad 注册类型；命令通过 ModuleTypeSetValue 存取对象；RDB 使用 load/save，AOF rewrite 发出重建命令，free/mem_usage/digest 支持资源管理和一致性检查。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="45" y="110" width="250" height="105" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="170" y="141" class="head" text-anchor="middle">counter.set / incr</text><text x="170" y="169" class="sub" text-anchor="middle">OpenKey(WRITE)</text><text x="170" y="191" class="sub" text-anchor="middle">ModuleTypeSetValue</text></g><g><rect x="365" y="110" width="250" height="105" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="490" y="141" class="head" text-anchor="middle">Module Value</text><text x="490" y="169" class="sub" text-anchor="middle">CounterValue { long long }</text><text x="490" y="191" class="sub" text-anchor="middle">SignalModifiedKey + Replicate</text></g><g><rect x="685" y="55" width="220" height="100" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="795" y="86" class="head" text-anchor="middle">RDB</text><text x="795" y="114" class="sub" text-anchor="middle">rdb_save / rdb_load</text><text x="795" y="136" class="sub" text-anchor="middle">encver</text></g><g><rect x="965" y="55" width="195" height="100" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="1062.5" y="86" class="head" text-anchor="middle">AOF rewrite</text><text x="1062.5" y="114" class="sub" text-anchor="middle">EmitAOF</text><text x="1062.5" y="136" class="sub" text-anchor="middle">counter.set key value</text></g><g><rect x="685" y="230" width="220" height="100" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="795" y="261" class="head" text-anchor="middle">内存 / digest</text><text x="795" y="289" class="sub" text-anchor="middle">mem_usage / digest</text><text x="795" y="311" class="sub" text-anchor="middle">free</text></g><g><rect x="965" y="230" width="195" height="100" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="1062.5" y="261" class="head" text-anchor="middle">复制</text><text x="1062.5" y="289" class="sub" text-anchor="middle">ReplicateVerbatim</text><text x="1062.5" y="311" class="sub" text-anchor="middle">副本执行模块命令</text></g><path d="M295 160L360 160" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M615 135L650 135L650 105L680 105" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="665" y="94" class="small" text-anchor="middle">save/load</text><path d="M615 160L945 105" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="790" y="118" class="small" text-anchor="middle">rewrite</text><path d="M615 185L650 280L680 280" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="665" y="263" class="small" text-anchor="middle">free / digest</text><path d="M615 185L945 280" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="800" y="258" class="small" text-anchor="middle">replication</text><text x="32" y="550" font-size="13" fill="#6c817c">模块自定义类型必须为 RDB/AOF、复制、释放和升级定义可验证的兼容策略。</text></svg>