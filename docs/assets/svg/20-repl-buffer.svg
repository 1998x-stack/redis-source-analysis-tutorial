<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="repl-buffer-title repl-buffer-desc"><title id="repl-buffer-title">Redis 7.2.4 的共享复制缓冲区与 backlog 索引</title><desc id="repl-buffer-desc">复制字节进入共享 replBufBlock 列表；replica 客户端和 replication backlog 通过引用计数共享块，replBacklog 使用 rax 索引加速 offset 定位。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="420" y="85" width="360" height="90" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="600" y="116" class="head" text-anchor="middle">Replication stream</text><text x="600" y="143" class="sub" text-anchor="middle">master_repl_offset 按字节前进</text></g><g><rect x="75" y="275" width="300" height="125" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="225" y="306" class="head" text-anchor="middle">replBufBlock list</text><text x="225" y="333" class="sub" text-anchor="middle">共享字节块 + refcount</text><text x="225" y="355" class="sub" text-anchor="middle">供 replica 输出与 backlog 引用</text></g><g><rect x="450" y="275" width="300" height="125" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="600" y="306" class="head" text-anchor="middle">replBacklog</text><text x="600" y="333" class="sub" text-anchor="middle">offset / histlen</text><text x="600" y="355" class="sub" text-anchor="middle">ref_repl_buf_node</text></g><g><rect x="825" y="275" width="300" height="125" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="975" y="306" class="head" text-anchor="middle">blocks_index（rax）</text><text x="975" y="333" class="sub" text-anchor="middle">索引部分 buffer blocks</text><text x="975" y="355" class="sub" text-anchor="middle">PSYNC offset 快速定位</text></g><path d="M500 175 L225 265" fill="none" stroke="#167e80" stroke-width="2.5" marker-end="url(#arr)"/><text x="360" y="225" class="edge" text-anchor="middle">写入字节块</text><path d="M600 175 L600 265" fill="none" stroke="#52799b" stroke-width="2.5" marker-end="url(#arr)"/><text x="640" y="225" class="edge" text-anchor="middle">backlog 引用</text><path d="M750 337 L820 337" fill="none" stroke="#c36b45" stroke-width="2.7" marker-end="url(#arr)"/><text x="785" y="327" class="edge" text-anchor="middle">索引块位置</text><text x="34" y="548" font-size="13" fill="#71827f">不能将 7.2.4 的内部复制缓冲实现简化成一个独立的固定长度 byte[] 环形数组。</text></svg>