<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title-metrics desc-metrics"><title id="title-metrics">内存指标为什么不能直接相减解释</title><desc id="desc-metrics">used_memory 是 Redis 分配器口径，used_memory_rss 是常驻集合；碎片、页保留及共享映射使指标不同</desc><defs><marker id="arrow-metrics" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-metrics" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="420" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="420" fill="url(#dots-metrics)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">内存指标为什么不能直接相减解释</text><rect x="60" y="85" width="260" height="104" rx="12" fill="#e2f2ee" stroke="#5f9a8b" stroke-width="1.8"/><text x="190" y="119" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">used_memory</text><text x="190" y="144" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">Redis allocator allocation</text><rect x="355" y="85" width="250" height="104" rx="12" fill="#f6eee6" stroke="#c58b67" stroke-width="1.8"/><text x="480" y="119" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">used_memory_rss</text><text x="480" y="144" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">进程 resident set</text><rect x="645" y="85" width="250" height="104" rx="12" fill="#eeeafa" stroke="#7869b3" stroke-width="1.8"/><text x="770" y="119" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">used_memory_peak</text><text x="770" y="144" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">历史已用峰值</text><rect x="122" y="260" width="225" height="85" rx="12" fill="#f7f3e7" stroke="#b29a65" stroke-width="1.8"/><text x="234.5" y="294" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">碎片与分配器保留</text><text x="234.5" y="319" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">allocator / rss overhead</text><rect x="397" y="260" width="225" height="85" rx="12" fill="#eaf3f3" stroke="#789ea0" stroke-width="1.8"/><text x="509.5" y="294" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">共享与映射页</text><text x="509.5" y="319" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">与业务数据非一一对应</text><rect x="672" y="260" width="225" height="85" rx="12" fill="#eaf3f0" stroke="#6d9a89" stroke-width="1.8"/><text x="784.5" y="294" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">诊断组合</text><text x="784.5" y="319" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">INFO memory + MEMORY STATS</text><path d="M480 190 L480 250" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-metrics)"/><text x="56" y="405" fill="#506b6f" font-size="14" font-family="Arial,'Noto Sans CJK SC'">这些指标不是三个互斥的“内存桶”。它们口径不同，配合使用，不能机械做精确分解。</text></svg>