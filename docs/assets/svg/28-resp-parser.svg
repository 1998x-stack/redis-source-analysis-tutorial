<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c28resp-t c28resp-d"><title id="c28resp-t">RESP 解析必须服从 TCP 字节流，而不是 read() 次数</title><desc id="c28resp-d">一个 RESP 命令可以跨多次 recv 到达，多个命令也可以在一个 TCP 片段中拼接；解析器必须保留 incomplete frame，验证长度和 CRLF，并循环消费 pipeline。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="45" y="110" width="220" height="110" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="155" y="141" class="head" text-anchor="middle">recv() bytes</text><text x="155" y="169" class="sub" text-anchor="middle">任意切片 / 任意合并</text><text x="155" y="191" class="sub" text-anchor="middle">不是一条消息</text></g><g><rect x="325" y="110" width="220" height="110" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="435" y="141" class="head" text-anchor="middle">输入缓冲</text><text x="435" y="169" class="sub" text-anchor="middle">追加字节</text><text x="435" y="191" class="sub" text-anchor="middle">限制最大 querybuf</text></g><g><rect x="605" y="110" width="220" height="110" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="715" y="141" class="head" text-anchor="middle">增量解析</text><text x="715" y="169" class="sub" text-anchor="middle">*argc / $len / payload</text><text x="715" y="191" class="sub" text-anchor="middle">检查长度溢出和 CRLF</text></g><g><rect x="885" y="110" width="270" height="110" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="1020" y="141" class="head" text-anchor="middle">状态分支</text><text x="1020" y="169" class="sub" text-anchor="middle">MORE → 等下一次读</text><text x="1020" y="191" class="sub" text-anchor="middle">BAD → 错误并关闭</text><text x="1020" y="213" class="sub" text-anchor="middle">DONE → 执行并继续</text></g><path d="M265 165L320 165" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M545 165L600 165" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M825 165L880 165" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M1020 220L1020 315L435 315L435 350" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="730" y="302" class="small" text-anchor="middle">MORE</text><path d="M1020 220L1020 315L750 315L750 350" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="900" y="302" class="small" text-anchor="middle">DONE: pipeline</text><g><rect x="280" y="365" width="300" height="90" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="430" y="396" class="head" text-anchor="middle">保留未完成帧</text><text x="430" y="424" class="sub" text-anchor="middle">不要丢弃已接收字节</text></g><g><rect x="660" y="365" width="360" height="90" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="840" y="396" class="head" text-anchor="middle">消费一个命令后再解析下一个</text><text x="840" y="424" class="sub" text-anchor="middle">剩余字节仍可能包含完整命令</text></g><text x="32" y="550" font-size="13" fill="#6c817c">Mini-Redis 只接受 RESP2 数组 + bulk-string 命令参数；不代表完整 RESP2/RESP3 实现。</text></svg>