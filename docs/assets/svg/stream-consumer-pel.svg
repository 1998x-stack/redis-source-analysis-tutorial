<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-pel d-pel"><title id="t-pel">Consumer Group：分发、Pending、确认是三步</title><desc id="d-pel">group PEL 与 consumer PEL 共用 streamNACK 元信息；XACK 从两处移除，原 Stream 条目仍保留直到另外的删除/裁剪。</desc><defs><marker id="arr-pel" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-pel" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-pel)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">Consumer Group：分发、Pending、确认是三步</text><rect x="30" y="102" width="220" height="94" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="140" y="139" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">XREADGROUP</text><text x="140" y="166" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">消息交付 consumer A</text><path d="M251 148L306 148" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-pel)"/><rect x="317" y="102" width="269" height="94" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="451.5" y="139" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">group PEL</text><text x="451.5" y="166" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">id → streamNACK</text><path d="M587 148L643 148" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-pel)"/><rect x="652" y="102" width="268" height="94" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="786" y="139" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">consumer A PEL</text><text x="786" y="166" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">引用同一 NACK 元信息</text><rect x="135" y="281" width="284" height="89" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="277" y="318" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">XACK key group id</text><text x="277" y="345" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">解除 Pending 状态</text><path d="M420 327L495 327" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-pel)"/><rect x="506" y="281" width="306" height="89" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="659" y="318" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">从两个 PEL 移除</text><text x="659" y="345" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">并不等于 XDEL 原条目</text><text x="40" y="424" fill="#587277" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">注意：重试 / XCLAIM / XAUTOCLAIM 涉及消费组状态，不等于严格恰好一次交付。</text></svg>