<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-epoll d-epoll"><title id="t-epoll">文件事件注册与 epoll 状态的两层映射</title><desc id="d-epoll">aeFileEvent 在 Redis events[fd] 中保存 callback 与 mask；ae_epoll.c 将兴趣掩码注册给内核，返回 fired 数组后逐个调用回调。</desc><defs><marker id="arr-epoll" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-epoll" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-epoll)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">文件事件注册与 epoll 状态的两层映射</text><rect x="27" y="95" width="242" height="95" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="148" y="132" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">aeCreateFileEvent</text><text x="148" y="159" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">fd + READABLE/WRITABLE</text><path d="M270 143L321 143" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-epoll)"/><rect x="326" y="95" width="268" height="95" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="460" y="132" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">eventLoop.events[fd]</text><text x="460" y="159" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">mask + rfileProc/wfileProc</text><path d="M595 143L643 143" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-epoll)"/><rect x="648" y="95" width="284" height="95" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="790" y="132" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">epoll_ctl / epoll_wait</text><text x="790" y="159" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">内核观察 fd readiness</text><rect x="80" y="282" width="324" height="90" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="242" y="319" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">eventLoop.fired[]</text><text x="242" y="346" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">fd + mask 的就绪快照</text><path d="M405 325L471 325" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-epoll)"/><rect x="477" y="282" width="382" height="90" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="668" y="319" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">callback 调用</text><text x="668" y="346" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">默认读先写；AE_BARRIER 可反转</text><text x="44" y="424" fill="#587277" font-size="14" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">fd 就绪不等于一条完整 RESP 命令，callback 还需处理 EAGAIN、局部读取、缓冲与协议解析。</text></svg>