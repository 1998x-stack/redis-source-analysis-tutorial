<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r24cow-t r24cow-d"><title id="r24cow-t">写密集时后台持久化引发的内存峰值</title><desc id="r24cow-d">fork 不复制全部物理内存，但父进程继续修改页面会触发 COW；THP 大页可能放大相关内存成本，RSS/allocator 与配置的 maxmemory 不是同一计量。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="405" y="80" width="390" height="90" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="600" y="111" class="head" text-anchor="middle">fork() BGSAVE / BGREWRITEAOF</text><text x="600" y="139" class="sub" text-anchor="middle">父子共享初始物理页面</text></g><g><rect x="80" y="285" width="350" height="120" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="255" y="316" class="head" text-anchor="middle">父进程继续写入</text><text x="255" y="344" class="sub" text-anchor="middle">修改映射 → COW 私有页</text><text x="255" y="366" class="sub" text-anchor="middle">写脏页面越多，额外占用越高</text></g><g><rect x="770" y="285" width="350" height="120" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="945" y="316" class="head" text-anchor="middle">子进程读快照</text><text x="945" y="344" class="sub" text-anchor="middle">保存 RDB / AOF BASE</text><text x="945" y="366" class="sub" text-anchor="middle">直到完成才退出</text></g><path d="M500 170L265 278" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="365" y="225" class="small" text-anchor="middle">父继续写</text><path d="M700 170L945 278" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="850" y="225" class="small" text-anchor="middle">child 读快照</text><g><rect x="395" y="460" width="410" height="65" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="600" y="491" class="head" text-anchor="middle">RSS 峰值可能高于 used_memory</text><text x="600" y="519" class="sub" text-anchor="middle">评估物理内存、THP、overcommit 与系统可用余量</text></g><path d="M255 405L530 456" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="375" y="441" class="small" text-anchor="middle">COW</text><text x="32" y="550" font-size="13" fill="#6c817c">不要将 maxmemory 当作容器内存上限；还要为 allocator、客户端缓冲和 fork COW 留余量。</text></svg>