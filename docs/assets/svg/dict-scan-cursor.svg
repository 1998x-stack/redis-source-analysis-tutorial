<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-dict-scan desc-dict-scan"><title id="title-dict-scan">SCAN：游标并不等于线性数组下标</title><desc id="desc-dict-scan">SCAN 的游标推进涉及位翻转以适应扩缩容；结果可能重复，且每次调用返回个数不固定。</desc><defs><marker id="arrow-dict-scan" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-dict-scan" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-dict-scan)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">SCAN：游标并不等于线性数组下标</text><rect x="45" y="97" width="250" height="85" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="170" y="135" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SCAN 0 COUNT 2</text><text x="170" y="158.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">COUNT 是提示，不是配额</text><path d="M295 140L355 140" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-dict-scan)"/><rect x="359" y="97" width="250" height="85" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="484" y="135" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">dictScan(dict, v)</text><text x="484" y="158.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">按哈希桶进度迭代</text><path d="M609 140L675 140" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-dict-scan)"/><rect x="675" y="97" width="241" height="85" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="795.5" y="135" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">下一个游标</text><text x="795.5" y="158.2" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">直到返回 0</text><text x="55" y="241" fill="#20363b" font-size="17" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">示意：按位翻转推进，而非 0,1,2,3 线性扫</text><rect x="45" y="265" width="97" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="93.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">000 / 0</text><rect x="155" y="265" width="97" height="32" rx="7" fill="#efebfa" stroke="#bdd3cd"/><text x="203.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">100 / 4</text><rect x="265" y="265" width="97" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="313.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">010 / 2</text><rect x="375" y="265" width="97" height="32" rx="7" fill="#efebfa" stroke="#bdd3cd"/><text x="423.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">110 / 6</text><rect x="485" y="265" width="97" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="533.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">001 / 1</text><rect x="595" y="265" width="97" height="32" rx="7" fill="#efebfa" stroke="#bdd3cd"/><text x="643.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">101 / 5</text><rect x="705" y="265" width="97" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="753.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">011 / 3</text><rect x="815" y="265" width="97" height="32" rx="7" fill="#efebfa" stroke="#bdd3cd"/><text x="863.5" y="287" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">111 / 7</text><rect x="66" y="361" width="375" height="68" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="253.5" y="391.6" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">完整扫描保证</text><text x="253.5" y="409.96" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">稳定存在的元素会被返回</text><rect x="510" y="361" width="375" height="68" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="697.5" y="391.6" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">完整扫描非保证</text><text x="697.5" y="409.96" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">无重复 · 每次固定数量</text></svg>