<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r22quorum-t r22quorum-d"><title id="r22quorum-t">Sentinel 的主观下线、客观下线和授权选举</title><desc id="r22quorum-d">每个 Sentinel 独立根据 PING 探测 SDOWN；达到指定 quorum 才有 ODOWN；实际故障转移 leader 还必须获得多数 Sentinel 授权与至少 quorum 票。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="50" y="125" width="230" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="165" y="156" class="head" text-anchor="middle">Sentinel A</text><text x="165" y="184" class="sub" text-anchor="middle">PING 超时 → SDOWN</text><text x="165" y="206" class="sub" text-anchor="middle">本地判断</text></g><g><rect x="355" y="125" width="230" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="470" y="156" class="head" text-anchor="middle">Sentinel B</text><text x="470" y="184" class="sub" text-anchor="middle">对 master 进行探测</text><text x="470" y="206" class="sub" text-anchor="middle">互询意见</text></g><g><rect x="660" y="125" width="230" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="775" y="156" class="head" text-anchor="middle">Sentinel C</text><text x="775" y="184" class="sub" text-anchor="middle">对 master 进行探测</text><text x="775" y="206" class="sub" text-anchor="middle">互询意见</text></g><g><rect x="955" y="125" width="195" height="100" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="1052.5" y="156" class="head" text-anchor="middle">Master</text><text x="1052.5" y="184" class="sub" text-anchor="middle">不可达？</text><text x="1052.5" y="206" class="sub" text-anchor="middle">从属健康检查</text></g><path d="M280 178L350 178" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M585 178L655 178" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M890 178L950 178" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="150" y="330" width="365" height="105" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="332.5" y="361" class="head" text-anchor="middle">ODOWN：quorum 判断</text><text x="332.5" y="389" class="sub" text-anchor="middle">本地 SDOWN + 其他 Sentinel 报告</text><text x="332.5" y="411" class="sub" text-anchor="middle">达到配置的 quorum 才转 ODOWN</text></g><g><rect x="680" y="330" width="385" height="105" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="872.5" y="361" class="head" text-anchor="middle">Leader 授权：多数 + quorum</text><text x="872.5" y="389" class="sub" text-anchor="middle">投票绝对多数和配置门槛</text><text x="872.5" y="411" class="sub" text-anchor="middle">每个 epoch 唯一授权领导者</text></g><path d="M480 225L480 278L335 278L335 322" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="350" y="270" class="small" text-anchor="middle">达成 ODOWN</text><path d="M515 383L675 383" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="595" y="371" class="small" text-anchor="middle">启动选举</text><text x="32" y="550" font-size="13" fill="#6c817c">ODOWN 不是高可用的全部条件；quorum 与 leader 多数授权是两道不同门槛。</text></svg>