<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" role="img" aria-labelledby="title-quick desc-quick"><title id="title-quick">Redis 7.2 的 List：小列表可直接 listpack，较大列表可转 quicklist</title><desc id="desc-quick">List 值的对象编码可以是 listpack 或 quicklist；quicklist 由多个结点连接，结点通常包裹紧凑的 listpack，也可有 plain 结点</desc><defs><marker id="arrow-quick" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-quick" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="466" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="466" fill="url(#dots-quick)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">Redis 7.2 的 List：小列表可直接 listpack，较大列表可转 quicklist</text><rect x="330" y="77" width="303" height="67" rx="12" fill="#f0f1f6" stroke="#8774b0" stroke-width="1.8"/><text x="481.5" y="106.5" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">List object</text><text x="481.5" y="131.5" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">OBJ_ENCODING_*</text><path d="M415 145 L253 205" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-quick)"/><path d="M540 145 L702 205" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-quick)"/><rect x="68" y="214" width="340" height="100" rx="12" fill="#e5f3ed" stroke="#569989" stroke-width="1.8"/><text x="238" y="248" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">直接 listpack</text><text x="238" y="273" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">小体量的连续存储</text><rect x="530" y="214" width="357" height="100" rx="12" fill="#f9eee6" stroke="#c3825d" stroke-width="1.8"/><text x="708.5" y="248" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">quicklist</text><text x="708.5" y="273" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">多个结点 / fill 控制</text><rect x="552" y="353" width="95" height="49" rx="7" fill="#e9f2ef" stroke="#6c9c91"/><rect x="664" y="353" width="95" height="49" rx="7" fill="#e9f2ef" stroke="#6c9c91"/><rect x="776" y="353" width="95" height="49" rx="7" fill="#f6ebe6" stroke="#c78869"/><text x="600" y="383" text-anchor="middle" fill="#2c514c" font-size="14" font-family="Arial,sans-serif">listpack</text><text x="711" y="383" text-anchor="middle" fill="#2c514c" font-size="14" font-family="Arial,sans-serif">listpack</text><text x="823" y="383" text-anchor="middle" fill="#6e4b3a" font-size="14" font-family="Arial,sans-serif">PLAIN</text><path d="M647 377 L659 377" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-quick)"/><path d="M759 377 L771 377" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-quick)"/><text x="57" y="429" font-size="14" fill="#52696a" font-family="Arial,'Noto Sans CJK SC'">这里的两条路径表示对象编码选择，不是每个 quicklist 结点都能任意混放。</text></svg>