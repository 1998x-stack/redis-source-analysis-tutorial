<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c28mini-t c28mini-d"><title id="c28mini-t">教学 Mini-Redis 的最小架构与明确省略项</title><desc id="c28mini-d">实现仅覆盖 loopback TCP、epoll、增量 RESP2 请求解析、命令分派、字符串/哈希存储和回复缓冲；未实现持久化、复制、过期、ACL、事务、模块、Cluster 等。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="45" y="105" width="210" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="150" y="136" class="head" text-anchor="middle">TCP Listener</text><text x="150" y="164" class="sub" text-anchor="middle">127.0.0.1</text><text x="150" y="186" class="sub" text-anchor="middle">nonblocking accept4</text></g><g><rect x="300" y="105" width="210" height="100" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="405" y="136" class="head" text-anchor="middle">epoll loop</text><text x="405" y="164" class="sub" text-anchor="middle">readable / writable</text><text x="405" y="186" class="sub" text-anchor="middle">EAGAIN / partial write</text></g><g><rect x="555" y="105" width="210" height="100" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="660" y="136" class="head" text-anchor="middle">RESP parser</text><text x="660" y="164" class="sub" text-anchor="middle">bounded input buffer</text><text x="660" y="186" class="sub" text-anchor="middle">binary-safe arguments</text></g><g><rect x="810" y="105" width="345" height="100" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="982.5" y="136" class="head" text-anchor="middle">Command dispatch</text><text x="982.5" y="164" class="sub" text-anchor="middle">PING / SET / GET / HSET / HGET</text><text x="982.5" y="186" class="sub" text-anchor="middle">DEL / EXISTS / DBSIZE / QUIT</text></g><path d="M255 155L295 155" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M510 155L550 155" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M765 155L805 155" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="375" y="300" width="280" height="100" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="515" y="331" class="head" text-anchor="middle">Hash table keyspace</text><text x="515" y="359" class="sub" text-anchor="middle">FNV-1a + chaining + resize</text><text x="515" y="381" class="sub" text-anchor="middle">String / Hash values</text></g><g><rect x="765" y="300" width="280" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="905" y="331" class="head" text-anchor="middle">RESP reply buffer</text><text x="905" y="359" class="sub" text-anchor="middle">partial send handling</text><text x="905" y="381" class="sub" text-anchor="middle">simple / bulk / integer / error</text></g><path d="M900 205L535 295" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M655 350L760 350" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="260" y="455" width="680" height="60" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="600" y="486" class="head" text-anchor="middle">明确不实现：AOF/RDB · replication · TTL/eviction · ACL/TLS · Lua/Functions · modules · Cluster</text></g><text x="32" y="550" font-size="13" fill="#6c817c">该示例是可运行教学切片，不是兼容 Redis 的替代服务器。</text></svg>