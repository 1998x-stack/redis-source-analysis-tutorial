<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r22slots-t r22slots-d"><title id="r22slots-t">Cluster 的 16384 槽和 MOVED/ASK 路由</title><desc id="r22slots-d">CRC16(key or hash tag) &amp; 0x3fff 得到槽；静态稳定归属错节点请求收到 MOVED，迁移中的缺失 key 从 source 返回 ASK；ASKING 临时放行目标节点。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="40" y="105" width="280" height="115" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="180" y="136" class="head" text-anchor="middle">客户端 key</text><text x="180" y="164" class="sub" text-anchor="middle">{shop:7}:cart</text><text x="180" y="186" class="sub" text-anchor="middle">CRC16(shop:7) &amp; 0x3fff</text></g><g><rect x="380" y="105" width="250" height="115" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="505" y="136" class="head" text-anchor="middle">槽号 0…16383</text><text x="505" y="164" class="sub" text-anchor="middle">slot owner 查找</text><text x="505" y="186" class="sub" text-anchor="middle">server.cluster-&gt;slots[]</text></g><g><rect x="690" y="105" width="215" height="115" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="797.5" y="136" class="head" text-anchor="middle">节点 A</text><text x="797.5" y="164" class="sub" text-anchor="middle">当前 slot owner</text><text x="797.5" y="186" class="sub" text-anchor="middle">迁移中 MIGRATING</text></g><g><rect x="955" y="105" width="210" height="115" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="1060" y="136" class="head" text-anchor="middle">节点 B</text><text x="1060" y="164" class="sub" text-anchor="middle">目标 IMPORTING</text><text x="1060" y="186" class="sub" text-anchor="middle">ASKING 后可接受</text></g><path d="M320 162L375 162" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M630 162L685 162" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M905 162L950 162" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="927.5" y="150" class="small" text-anchor="middle">MIGRATE</text><g><rect x="225" y="355" width="310" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="380" y="386" class="head" text-anchor="middle">稳定错节点：MOVED</text><text x="380" y="414" class="sub" text-anchor="middle">客户端更新 slot cache</text><text x="380" y="436" class="sub" text-anchor="middle">以后长期路由新 owner</text></g><g><rect x="665" y="355" width="320" height="100" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="825" y="386" class="head" text-anchor="middle">迁移中缺失键：ASK</text><text x="825" y="414" class="sub" text-anchor="middle">先 ASKING 再临时访问目标</text><text x="825" y="436" class="sub" text-anchor="middle">不永久修改槽映射</text></g><path d="M780 220L780 290L380 290L380 350" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="520" y="280" class="small" text-anchor="middle">MOVED</text><path d="M1040 220L1040 290L825 290L825 350" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="900" y="280" class="small" text-anchor="middle">ASK</text><text x="32" y="550" font-size="13" fill="#6c817c">Redis 7.2 的逐键迁移仍需正确处理 MIGRATING / IMPORTING；不是 Redis 8.4 原子槽迁移。</text></svg>