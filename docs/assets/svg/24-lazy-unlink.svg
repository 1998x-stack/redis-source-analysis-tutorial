<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r24unlink-t r24unlink-d"><title id="r24unlink-t">DEL 与 UNLINK 的可见性和回收线程边界</title><desc id="r24unlink-d">UNLINK 从 keyspace 同步移除可见键，再视对象 free-effort 和引用计数选择后台线程或立即释放；不是所有 UNLINK 都必然异步。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="55" y="125" width="260" height="112" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="185" y="156" class="head" text-anchor="middle">DEL key</text><text x="185" y="184" class="sub" text-anchor="middle">从 dict / expires 删除键</text><text x="185" y="206" class="sub" text-anchor="middle">同步释放值对象</text></g><g><rect x="365" y="125" width="260" height="112" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="495" y="156" class="head" text-anchor="middle">UNLINK key</text><text x="495" y="184" class="sub" text-anchor="middle">先从 keyspace 脱离</text><text x="495" y="206" class="sub" text-anchor="middle">客户端立刻看不到键</text></g><g><rect x="705" y="125" width="205" height="112" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="807.5" y="156" class="head" text-anchor="middle">freeObjAsync</text><text x="807.5" y="184" class="sub" text-anchor="middle">估计 free effort</text><text x="807.5" y="206" class="sub" text-anchor="middle">查看 refcount</text></g><g><rect x="950" y="80" width="215" height="95" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="1057.5" y="111" class="head" text-anchor="middle">小对象/共享对象</text><text x="1057.5" y="139" class="sub" text-anchor="middle">同步 decrRefCount</text><text x="1057.5" y="161" class="sub" text-anchor="middle">可能即时释放</text></g><g><rect x="950" y="260" width="215" height="95" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="1057.5" y="291" class="head" text-anchor="middle">大、可异步对象</text><text x="1057.5" y="319" class="sub" text-anchor="middle">BIO lazyfree 工作队列</text><text x="1057.5" y="341" class="sub" text-anchor="middle">后台释放内存</text></g><path d="M625 181L700 181" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M910 155L945 122" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="925" y="115" class="small" text-anchor="middle">轻量路径</text><path d="M910 203L945 307" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="935" y="273" class="small" text-anchor="middle">异步路径</text><g><rect x="355" y="400" width="540" height="93" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="625" y="431" class="head" text-anchor="middle">UNLINK 返回 ≠ 内存已经全部回收</text><text x="625" y="459" class="sub" text-anchor="middle">INFO memory: lazyfree_pending_objects / 实际 RSS</text><text x="625" y="481" class="sub" text-anchor="middle">可能仍存在 allocator 碎片与异步队列</text></g><text x="32" y="550" font-size="13" fill="#6c817c">lazyfreeGetFreeEffort 的估计与对象真实分配数不同；异步释放策略不能保证毫秒级收敛。</text></svg>