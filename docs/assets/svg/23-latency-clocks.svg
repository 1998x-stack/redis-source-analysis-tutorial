<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r23clocks-t r23clocks-d"><title id="r23clocks-t">客户端感知延迟与服务器慢日志的时间边界</title><desc id="r23clocks-d">客户端 RTT 包含排队、传输、命令处理及回复；SLOWLOG duration 只反映 Redis 命令执行阶段，LATENCY 记录标记的内部事件，系统采样另看调度与 I/O。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="35" y="115" width="235" height="106" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="152.5" y="146" class="head" text-anchor="middle">客户端 RTT</text><text x="152.5" y="174" class="sub" text-anchor="middle">网络 + 队列 + 执行</text><text x="152.5" y="196" class="sub" text-anchor="middle">发送 / 返回总时间</text></g><g><rect x="315" y="115" width="235" height="106" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="432.5" y="146" class="head" text-anchor="middle">SLOWLOG</text><text x="432.5" y="174" class="sub" text-anchor="middle">call() 的执行耗时</text><text x="432.5" y="196" class="sub" text-anchor="middle">阈值单位 μs</text></g><g><rect x="595" y="115" width="235" height="106" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="712.5" y="146" class="head" text-anchor="middle">LATENCY</text><text x="712.5" y="174" class="sub" text-anchor="middle">内部事件的毫秒峰值</text><text x="712.5" y="196" class="sub" text-anchor="middle">按事件名保存样本</text></g><g><rect x="875" y="115" width="280" height="106" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="1015" y="146" class="head" text-anchor="middle">系统追踪</text><text x="1015" y="174" class="sub" text-anchor="middle">perf / /proc / vmstat</text><text x="1015" y="196" class="sub" text-anchor="middle">CPU、调度、fork、I/O</text></g><path d="M270 167L310 167" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M550 167L590 167" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M830 167L870 167" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="105" y="325" width="290" height="103" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="250" y="356" class="head" text-anchor="middle">问题 A：RTT 高</text><text x="250" y="384" class="sub" text-anchor="middle">SLOWLOG 没条目</text><text x="250" y="406" class="sub" text-anchor="middle">先看网络/排队/输出缓冲</text></g><g><rect x="455" y="325" width="290" height="103" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="600" y="356" class="head" text-anchor="middle">问题 B：SLOWLOG 高</text><text x="600" y="384" class="sub" text-anchor="middle">命令 handler 可能昂贵</text><text x="600" y="406" class="sub" text-anchor="middle">定位 key 大小和调用路径</text></g><g><rect x="805" y="325" width="290" height="103" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="950" y="356" class="head" text-anchor="middle">问题 C：LATENCY 事件</text><text x="950" y="384" class="sub" text-anchor="middle">fork / AOF / expire / command</text><text x="950" y="406" class="sub" text-anchor="middle">结合事件名追源码</text></g><path d="M135 221L135 275L250 275L250 320" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="200" y="263" class="small" text-anchor="middle">未必是执行慢</text><path d="M435 221L435 275L600 275L600 320" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="530" y="263" class="small" text-anchor="middle">CPU 执行</text><path d="M720 221L720 275L950 275L950 320" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="820" y="263" class="small" text-anchor="middle">事件分类</text><text x="32" y="550" font-size="13" fill="#6c817c">一个指标正常不能排除其他层出问题；所有时间序列应按同一时间基准对齐。</text></svg>