<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 460" aria-labelledby="t-conn d-conn"><title id="t-conn">网络入口：ConnectionType 抽象和 RESP 解析分层</title><desc id="d-conn">监听 socket 接受连接后包装为 connection；ae 触发 read callback；readQueryFromClient 把字节加入 querybuf，协议解析后执行命令。</desc><defs><marker id="arr-conn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#637e79"/></marker><pattern id="dots-conn" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dce9e3"/></pattern></defs><rect x="0" y="0" width="960" height="460" rx="12" fill="#fbfcfa"/><rect x="0" y="0" width="960" height="460" fill="url(#dots-conn)"/><text x="30" y="42" fill="#264148" font-size="19" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">网络入口：ConnectionType 抽象和 RESP 解析分层</text><rect x="29" y="116" width="179" height="85" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="118.5" y="153" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">TCP/Unix/TLS</text><text x="118.5" y="178.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">listener accept</text><path d="M208 160L249 160" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-conn)"/><rect x="254" y="116" width="198" height="85" rx="10" fill="#efecf8" stroke="#7864ae" stroke-width="1.5"/><text x="353" y="153" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ConnectionType</text><text x="353" y="178.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">read / write vtable</text><path d="M453 160L495 160" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-conn)"/><rect x="501" y="116" width="187" height="85" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="594.5" y="153" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">readQueryFromClient</text><text x="594.5" y="178.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">读字节 / querybuf</text><path d="M690 160L729 160" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-conn)"/><rect x="735" y="116" width="195" height="85" rx="10" fill="#f9eee4" stroke="#bc7650" stroke-width="1.5"/><text x="832.5" y="153" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">processInputBuffer</text><text x="832.5" y="178.9" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">RESP 构造 argv</text><rect x="308" y="300" width="355" height="84" rx="10" fill="#e4f4ef" stroke="#167e80" stroke-width="1.5"/><text x="485.5" y="337" fill="#264148" font-size="17" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">processCommand → call</text><text x="485.5" y="362.15999999999997" fill="#587277" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">同一连接可有多条请求 / pipeline</text><path d="M836 202L607 291" fill="none" stroke="#637e79" stroke-width="2.5" marker-end="url(#arr-conn)"/><text x="40" y="425" fill="#587277" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">读一次 socket ≠ 读完整命令；querybuf 与解析器承担拆包、粘包和部分帧处理。</text></svg>