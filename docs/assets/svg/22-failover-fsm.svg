<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r22failover-t r22failover-d"><title id="r22failover-t">Sentinel 故障转移状态机</title><desc id="r22failover-d">ODOWN 触发尝试，选出 leader 后选择合适 replica，发送 REPLICAOF NO ONE，等待晋升并重配其他 replica，最后更新 master 配置。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="35" y="120" width="206" height="104" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="138" y="151" class="head" text-anchor="middle">ODOWN</text><text x="138" y="179" class="sub" text-anchor="middle">master 故障证据</text><text x="138" y="201" class="sub" text-anchor="middle">开始本轮 epoch</text></g><g><rect x="280" y="120" width="206" height="104" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="383" y="151" class="head" text-anchor="middle">WAIT_START</text><text x="383" y="179" class="sub" text-anchor="middle">等待 leader 选举</text><text x="383" y="201" class="sub" text-anchor="middle">多数授权</text></g><g><rect x="525" y="120" width="206" height="104" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="628" y="151" class="head" text-anchor="middle">SELECT_SLAVE</text><text x="628" y="179" class="sub" text-anchor="middle">筛选存活/同步状况</text><text x="628" y="201" class="sub" text-anchor="middle">priority + offset</text></g><g><rect x="770" y="120" width="206" height="104" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="873" y="151" class="head" text-anchor="middle">PROMOTE</text><text x="873" y="179" class="sub" text-anchor="middle">REPLICAOF NO ONE</text><text x="873" y="201" class="sub" text-anchor="middle">等待角色提升</text></g><path d="M241 170L275 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M486 170L520 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M731 170L765 170" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="510" y="340" width="340" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="680" y="371" class="head" text-anchor="middle">RECONF_SLAVES</text><text x="680" y="399" class="sub" text-anchor="middle">将剩余副本指向新主</text><text x="680" y="421" class="sub" text-anchor="middle">部分配置逐步传播</text></g><g><rect x="910" y="340" width="250" height="100" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="1035" y="371" class="head" text-anchor="middle">UPDATE_CONFIG</text><text x="1035" y="399" class="sub" text-anchor="middle">新主成为监控目标</text><text x="1035" y="421" class="sub" text-anchor="middle">配置变更传播</text></g><path d="M880 225L880 295L680 295L680 335" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="760" y="287" class="small" text-anchor="middle">晋升已确认</text><path d="M850 390L905 390" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="877.5" y="378" class="small" text-anchor="middle">收敛</text><g><rect x="55" y="340" width="380" height="100" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="245" y="371" class="head" text-anchor="middle">异常出口</text><text x="245" y="399" class="sub" text-anchor="middle">选举失败、候选失联</text><text x="245" y="421" class="sub" text-anchor="middle">等待重试 / 超时处理</text></g><path d="M390 225L390 290L245 290L245 335" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="300" y="280" class="small" text-anchor="middle">需重试</text><text x="32" y="550" font-size="13" fill="#6c817c">Sentinel 主从切换不是无损强一致：故障窗口的未同步写入仍可能丢失。</text></svg>