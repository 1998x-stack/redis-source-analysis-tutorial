<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-intset desc-intset"><title id="title-intset">intset 升级：一个大整数让整块数组变宽</title><desc id="desc-intset">intset 用连续排序整数数组；加入超过当前编码范围的整数需要把所有元素升级到更宽的编码。</desc><defs><marker id="arrow-intset" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-intset" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-intset)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">intset 升级：一个大整数让整块数组变宽</text><rect x="50" y="117" width="235" height="92" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="167.5" y="155" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">int16 · 2 bytes/element</text><text x="167.5" y="182" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">[4, 6, 9] · sorted</text><path d="M287 164L346 164" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-intset)"/><text x="316.5" y="156" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">加入 65535</text><rect x="357" y="117" width="235" height="92" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="474.5" y="155" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">升级搬移</text><text x="474.5" y="182" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">intsetUpgradeAndAdd</text><path d="M594 164L650 164" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-intset)"/><rect x="660" y="117" width="245" height="92" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="782.5" y="155" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">int32 · 4 bytes/element</text><text x="782.5" y="182" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">[4, 6, 9, 65535]</text><rect x="82" y="262" width="54" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="109" y="284" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">4</text><rect x="142" y="262" width="54" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="169" y="284" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">6</text><rect x="202" y="262" width="54" height="32" rx="7" fill="#dff1ea" stroke="#bdd3cd"/><text x="229" y="284" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">9</text><rect x="616" y="262" width="67" height="32" rx="7" fill="#faeee7" stroke="#bdd3cd"/><text x="649.5" y="284" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">4</text><rect x="688" y="262" width="67" height="32" rx="7" fill="#faeee7" stroke="#bdd3cd"/><text x="721.5" y="284" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">6</text><rect x="760" y="262" width="67" height="32" rx="7" fill="#faeee7" stroke="#bdd3cd"/><text x="793.5" y="284" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">9</text><rect x="832" y="262" width="67" height="32" rx="7" fill="#faeee7" stroke="#bdd3cd"/><text x="865.5" y="284" fill="#20363b" font-size="14" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">65535</text><text x="45" y="344" fill="#557078" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">注意：intset 内部只会因更宽范围升级；Redis Set 对象本身还可转换为 listpack / hashtable。</text><text x="45" y="392" fill="#b86245" font-size="17" text-anchor="start" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">一次升级是 O(n) 重编码，不是简单修改 encoding 字段。</text></svg>