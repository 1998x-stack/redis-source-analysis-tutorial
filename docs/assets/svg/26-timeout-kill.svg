<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c26kill-t c26kill-d"><title id="c26kill-t">Lua 指令计数 Hook、BUSY 状态与 KILL 边界</title><desc id="c26kill-d">Redis 7.2.4 在 Lua VM 上设置每 100000 条指令触发的 count hook；超时后进入 timedout 状态。尚未写数据时可 SCRIPT KILL；已经执行写命令则 UNKILLABLE。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="55" y="105" width="250" height="100" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="180" y="136" class="head" text-anchor="middle">Lua VM 执行</text><text x="180" y="164" class="sub" text-anchor="middle">纯 Lua 运算或 redis.call</text><text x="180" y="186" class="sub" text-anchor="middle">主线程暂时不调度其他命令</text></g><g><rect x="380" y="105" width="250" height="100" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="505" y="136" class="head" text-anchor="middle">Count Hook</text><text x="505" y="164" class="sub" text-anchor="middle">LUA_MASKCOUNT</text><text x="505" y="186" class="sub" text-anchor="middle">每 100000 条指令检查</text></g><g><rect x="705" y="105" width="250" height="100" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="830" y="136" class="head" text-anchor="middle">scriptInterrupt()</text><text x="830" y="164" class="sub" text-anchor="middle">比较 elapsed 与阈值</text><text x="830" y="186" class="sub" text-anchor="middle">进入 timedout / BUSY</text></g><path d="M305 155L375 155" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M630 155L700 155" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="90" y="320" width="380" height="105" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="280" y="351" class="head" text-anchor="middle">尚未执行写命令</text><text x="280" y="379" class="sub" text-anchor="middle">SCRIPT KILL → SCRIPT_KILLED</text><text x="280" y="401" class="sub" text-anchor="middle">Lua hook 抛错退出</text></g><g><rect x="730" y="320" width="380" height="105" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="920" y="351" class="head" text-anchor="middle">已执行写命令</text><text x="920" y="379" class="sub" text-anchor="middle">SCRIPT KILL → UNKILLABLE</text><text x="920" y="401" class="sub" text-anchor="middle">不会回滚已发生的写入</text></g><path d="M830 205L830 260L280 260L280 315" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="550" y="248" class="small" text-anchor="middle">未写入</text><path d="M830 205L830 260L920 260L920 315" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="870" y="248" class="small" text-anchor="middle">写入已发生</text><g><rect x="380" y="465" width="440" height="62" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="600" y="496" class="head" text-anchor="middle">超时是保护阈值，不是并行执行或强制回滚</text><text x="600" y="524" class="sub" text-anchor="middle">函数使用 FUNCTION KILL；脚本使用 SCRIPT KILL</text></g><text x="32" y="550" font-size="13" fill="#6c817c">纯 Lua 无限循环也会触发指令计数 hook；不要用生产实例测试死循环。</text></svg>