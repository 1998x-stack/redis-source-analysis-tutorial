<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="psync-decision-title psync-decision-desc"><title id="psync-decision-title">PSYNC 的部分重同步判定</title><desc id="psync-decision-desc">master 先检查 replication ID，再检查请求 offset 是否位于 backlog 可提供的区间；通过则 CONTINUE 并发送缺失字节，否则转 FULLRESYNC。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="45" y="125" width="215" height="110" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="152.5" y="156" class="head" text-anchor="middle">Replica 发 PSYNC</text><text x="152.5" y="183" class="sub" text-anchor="middle">replid + offset+1</text><text x="152.5" y="205" class="sub" text-anchor="middle">无缓存时 ? -1</text></g><g><rect x="345" y="125" width="215" height="110" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="452.5" y="156" class="head" text-anchor="middle">Replication ID</text><text x="452.5" y="183" class="sub" text-anchor="middle">current replid?</text><text x="452.5" y="205" class="sub" text-anchor="middle">replid2 且 offset 有效?</text></g><g><rect x="645" y="125" width="215" height="110" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="752.5" y="156" class="head" text-anchor="middle">Backlog 范围</text><text x="752.5" y="183" class="sub" text-anchor="middle">offset ≥ first byte</text><text x="752.5" y="205" class="sub" text-anchor="middle">offset ≤ end offset</text></g><g><rect x="945" y="125" width="210" height="110" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="1050" y="156" class="head" text-anchor="middle">恢复方式</text><text x="1050" y="183" class="sub" text-anchor="middle">CONTINUE / FULLRESYNC</text></g><path d="M260 180 L340 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M560 180 L640 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M860 180 L940 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="210" y="345" width="300" height="95" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="360" y="376" class="head" text-anchor="middle">部分重同步</text><text x="360" y="403" class="sub" text-anchor="middle">+CONTINUE [replid]</text><text x="360" y="425" class="sub" text-anchor="middle">发送 backlog 缺失区间</text></g><g><rect x="690" y="345" width="300" height="95" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="840" y="376" class="head" text-anchor="middle">全量重同步</text><text x="840" y="403" class="sub" text-anchor="middle">+FULLRESYNC replid offset</text><text x="840" y="425" class="sub" text-anchor="middle">重新发送 RDB 快照</text></g><path d="M750 235 L750 290 L360 290 L360 340" fill="none" stroke="#167e80" stroke-width="2.5" marker-end="url(#arr)"/><text x="530" y="280" class="edge" text-anchor="middle">ID 与 offset 均可满足</text><path d="M520 235 L520 290 L840 290 L840 340" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="680" y="280" class="edge" text-anchor="middle">ID 不符 / backlog 缺失</text><text x="34" y="548" font-size="13" fill="#71827f">replid2 只在 second_replid_offset 及其之前的历史边界内有效。</text></svg>