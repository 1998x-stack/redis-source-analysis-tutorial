<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="expire-evict-title expire-evict-desc"><title id="expire-evict-title">TTL expiration 与 maxmemory eviction 是两套独立机制</title><desc id="expire-evict-desc">过期根据键自己的绝对到期时间决定是否有效；淘汰由内存阈值和 maxmemory-policy 决定是否主动选择某个键释放内存。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="70" y="100" width="455" height="95" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="297.5" y="131" class="head" text-anchor="middle">Expiration：时间条件</text><text x="297.5" y="158" class="sub" text-anchor="middle">expires 字典存绝对到期时刻</text><text x="297.5" y="180" class="sub" text-anchor="middle">惰性检查 + 主动抽样删除</text></g><g><rect x="675" y="100" width="455" height="95" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="902.5" y="131" class="head" text-anchor="middle">Eviction：内存条件</text><text x="902.5" y="158" class="sub" text-anchor="middle">maxmemory 使用量超过可计入阈值</text><text x="902.5" y="180" class="sub" text-anchor="middle">按 policy 选择候选键删除</text></g><g><rect x="120" y="300" width="350" height="105" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="295" y="331" class="head" text-anchor="middle">expireIfNeeded()</text><text x="295" y="358" class="sub" text-anchor="middle">读取键时检查 TTL</text><text x="295" y="380" class="sub" text-anchor="middle">master 负责删除传播</text></g><g><rect x="730" y="300" width="350" height="105" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="905" y="331" class="head" text-anchor="middle">performEvictions()</text><text x="905" y="358" class="sub" text-anchor="middle">写命令前检查内存</text><text x="905" y="380" class="sub" text-anchor="middle">LRU / LFU / TTL / random</text></g><path d="M295 195 L295 290" fill="none" stroke="#52799b" stroke-width="2.5" marker-end="url(#arr)"/><text x="350" y="250" class="edge" text-anchor="middle">时间已到</text><path d="M900 195 L900 290" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="960" y="250" class="edge" text-anchor="middle">内存超限</text><g><rect x="420" y="455" width="360" height="65" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="600" y="486" class="head" text-anchor="middle">DEL / UNLINK 释放键空间</text><text x="600" y="513" class="sub" text-anchor="middle">原因不同，但删除可能传播到 AOF 与 replicas</text></g><path d="M295 405 L470 450" fill="none" stroke="#52799b" stroke-width="2.5" marker-end="url(#arr)"/><text x="380" y="435" class="edge" text-anchor="middle">过期删除</text><path d="M900 405 L730 450" fill="none" stroke="#7561a9" stroke-width="2.5" marker-end="url(#arr)"/><text x="820" y="435" class="edge" text-anchor="middle">淘汰删除</text><text x="34" y="548" font-size="13" fill="#71827f">TTL=0 不代表对象已在同一微秒释放；maxmemory 也不是 TTL 的另一个名字。</text></svg>