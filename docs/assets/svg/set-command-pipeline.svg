<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title-setpath desc-setpath"><title id="title-setpath">SET：条件检查与有效期属于写入语义</title><desc id="desc-setpath">setGenericCommand 分别处理 GET、NX/XX、TTL、写入、通知和传播的命令重写。</desc><defs><marker id="arrow-setpath" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-setpath" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="470" rx="14" fill="#fbfcf9"/><rect width="960" height="470" fill="url(#grid-setpath)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">SET：条件检查与有效期属于写入语义</text><rect x="42" y="128" width="174" height="94" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="129" y="166" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SET key value</text><text x="129" y="193" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">解析选项 NX/XX/EX</text><path d="M219 173L265 173" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-setpath)"/><rect x="275" y="128" width="174" height="94" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="362" y="166" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">解析选项</text><text x="362" y="193" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">GET/KEEPTTL/PXAT</text><path d="M450 173L496 173" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-setpath)"/><rect x="504" y="128" width="181" height="94" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="594.5" y="166" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">条件判断</text><text x="594.5" y="193" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">lookupKeyWrite</text><path d="M688 173L731 173" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-setpath)"/><rect x="739" y="128" width="181" height="94" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="829.5" y="166" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">setKey</text><text x="829.5" y="193" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">更新值与 TTL</text><rect x="235" y="303" width="250" height="73" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="360" y="335.85" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">条件不满足</text><text x="360" y="355.56" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">无写入 / NULL 回复</text><rect x="626" y="303" width="250" height="73" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="751" y="335.85" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">后续效果</text><text x="751" y="355.56" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">通知、响应、传播</text><path d="M597 224L389 293" stroke="#53736f" stroke-width="2.5"  fill="none" marker-end="url(#arrow-setpath)"/><text x="493" y="250.5" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">失败</text><path d="M827 224L750 293" stroke="#53736f" stroke-