<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r25tools-t r25tools-d"><title id="r25tools-t">定位链路：症状 → 指标 → 调用栈 → 代码 → 复现</title><desc id="r25tools-d">客户端 RTT 与 INFO/slowlog 定位现象；perf/strace/GDB 查看执行证据；固定源码路径解释原理；最小复现实验验证因果。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="35" y="125" width="215" height="104" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="142.5" y="156" class="head" text-anchor="middle">现象与时间点</text><text x="142.5" y="184" class="sub" text-anchor="middle">P99、OOM、连接重置</text><text x="142.5" y="206" class="sub" text-anchor="middle">收集客户端日志</text></g><g><rect x="280" y="125" width="215" height="104" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="387.5" y="156" class="head" text-anchor="middle">Redis 内部指标</text><text x="387.5" y="184" class="sub" text-anchor="middle">INFO / SLOWLOG</text><text x="387.5" y="206" class="sub" text-anchor="middle">LATENCY / CLIENT</text></g><g><rect x="525" y="125" width="215" height="104" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="632.5" y="156" class="head" text-anchor="middle">系统级证据</text><text x="632.5" y="184" class="sub" text-anchor="middle">perf / strace / /proc</text><text x="632.5" y="206" class="sub" text-anchor="middle">fork / syscalls / CPU</text></g><g><rect x="770" y="125" width="215" height="104" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="877.5" y="156" class="head" text-anchor="middle">代码层证据</text><text x="877.5" y="184" class="sub" text-anchor="middle">GDB bt / frame</text><text x="877.5" y="206" class="sub" text-anchor="middle">源码行 / 参数</text></g><g><rect x="1015" y="125" width="150" height="104" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="1090" y="156" class="head" text-anchor="middle">可复现?</text><text x="1090" y="184" class="sub" text-anchor="middle">控制变量</text><text x="1090" y="206" class="sub" text-anchor="middle">写回结论</text></g><path d="M250 177L275 177" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M495 177L520 177" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M740 177L765 177" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M985 177L1010 177" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="215" y="340" width="760" height="110" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="595" y="371" class="head" text-anchor="middle">证据链可以双向走：先现象定范围，也可从崩溃栈倒推用户输入</text><text x="595" y="399" class="sub" text-anchor="middle">关键是版本、时间窗口、采样偏差和有无替代解释</text><text x="595" y="421" class="sub" text-anchor="middle">不能以单次看似相关的 perf 栈直接断言代码有 bug</text></g><path d="M1090 229L1090 300L840 300L840 335" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="965" y="285" class="small" text-anchor="middle">回到假设</text><text x="32" y="550" font-size="13" fill="#6c817c">调试工具本身可影响时序；重现与对照组尤其重要。</text></svg>