<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="full-sync-title full-sync-desc"><title id="full-sync-title">全量同步：快照与增量流必须衔接</title><desc id="full-sync-desc">master 记录 FULLRESYNC 的初始 offset，在 BGSAVE/RDB 传输期间为 replica 保留后续复制流；RDB 完成后继续发送差量命令，replica 追上流后进入 ONLINE。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="35" y="125" width="205" height="110" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="137.5" y="156" class="head" text-anchor="middle">握手</text><text x="137.5" y="183" class="sub" text-anchor="middle">PING / REPLCONF</text><text x="137.5" y="205" class="sub" text-anchor="middle">PSYNC → FULLRESYNC</text></g><g><rect x="285" y="125" width="205" height="110" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="387.5" y="156" class="head" text-anchor="middle">建立同步边界</text><text x="387.5" y="183" class="sub" text-anchor="middle">initial offset</text><text x="387.5" y="205" class="sub" text-anchor="middle">WAIT_BGSAVE_END</text></g><g><rect x="535" y="125" width="205" height="110" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="637.5" y="156" class="head" text-anchor="middle">生成 RDB</text><text x="637.5" y="183" class="sub" text-anchor="middle">disk BGSAVE 或</text><text x="637.5" y="205" class="sub" text-anchor="middle">diskless socket</text></g><g><rect x="785" y="125" width="205" height="110" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="887.5" y="156" class="head" text-anchor="middle">传输 / 加载</text><text x="887.5" y="183" class="sub" text-anchor="middle">RDB bytes</text><text x="887.5" y="205" class="sub" text-anchor="middle">replica restore</text></g><g><rect x="1035" y="125" width="130" height="110" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="1100" y="156" class="head" text-anchor="middle">追赶</text><text x="1100" y="183" class="sub" text-anchor="middle">增量流</text><text x="1100" y="205" class="sub" text-anchor="middle">ONLINE</text></g><path d="M240 180 L280 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M490 180 L530 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M740 180 L780 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M990 180 L1030 180" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="240" y="350" width="720" height="100" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="600" y="381" class="head" text-anchor="middle">同步期间的写入持续进入 replication stream</text><text x="600" y="408" class="sub" text-anchor="middle">快照代表边界 offset 之前的状态；后续命令补齐边界之后的变化</text><text x="600" y="430" class="sub" text-anchor="middle">边界与增量缓冲若无法衔接，必须重新全量同步</text></g><path d="M635 235 L635 295 L600 295 L600 345" fill="none" stroke="#167e80" stroke-width="2.5" marker-end="url(#arr)"/><text x="620" y="285" class="edge" text-anchor="middle">RDB 子进程与主进程并行</text><text x="34" y="548" font-size="13" fill="#71827f">磁盘式与 diskless 同步在 RDB 传输介质上不同，但都必须保证快照边界和增量流连续。</text></svg>