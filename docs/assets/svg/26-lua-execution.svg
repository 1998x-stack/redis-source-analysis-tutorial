<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="c26lua-t c26lua-d"><title id="c26lua-t">EVAL 从脚本 SHA 到 Lua 执行和命令效果传播</title><desc id="c26lua-d">evalGenericCommand 解析 KEYS/ARGV，查询脚本缓存或编译函数，scriptPrepareForRun 做执行前检查，luaCallFunction 进入 Lua VM，redis.call 经 scriptCall 进入普通命令分派。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS SOURCE / FINAL CHAPTERS</text><g><rect x="35" y="115" width="205" height="108" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="137.5" y="146" class="head" text-anchor="middle">EVAL / EVALSHA</text><text x="137.5" y="174" class="sub" text-anchor="middle">numkeys + KEYS[] + ARGV[]</text><text x="137.5" y="196" class="sub" text-anchor="middle">SHA1 标识脚本</text></g><g><rect x="285" y="115" width="220" height="108" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="395" y="146" class="head" text-anchor="middle">eval.c</text><text x="395" y="174" class="sub" text-anchor="middle">evalGenericCommand</text><text x="395" y="196" class="sub" text-anchor="middle">缓存查找 / NOSCRIPT</text></g><g><rect x="550" y="115" width="220" height="108" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="660" y="146" class="head" text-anchor="middle">script.c</text><text x="660" y="174" class="sub" text-anchor="middle">scriptPrepareForRun</text><text x="660" y="196" class="sub" text-anchor="middle">权限 / OOM / 复制状态</text></g><g><rect x="815" y="115" width="340" height="108" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="985" y="146" class="head" text-anchor="middle">script_lua.c</text><text x="985" y="174" class="sub" text-anchor="middle">luaCallFunction → lua_pcall</text><text x="985" y="196" class="sub" text-anchor="middle">redis.call → scriptCall → call</text></g><path d="M240 169L280 169" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M505 169L545 169" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><path d="M770 169L810 169" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><g><rect x="175" y="345" width="300" height="95" rx="13" fill="#f2f4f3" stroke="#758783" stroke-width="1.7"/><text x="325" y="376" class="head" text-anchor="middle">一个共享 Lua VM</text><text x="325" y="404" class="sub" text-anchor="middle">KEYS / ARGV 注入本次调用</text><text x="325" y="426" class="sub" text-anchor="middle">全局表保护，不是每客户端 VM</text></g><g><rect x="725" y="345" width="300" height="95" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="875" y="376" class="head" text-anchor="middle">脚本效果传播</text><text x="875" y="404" class="sub" text-anchor="middle">写命令 effects → AOF / replicas</text><text x="875" y="426" class="sub" text-anchor="middle">执行完成后清理运行上下文</text></g><path d="M985 223L985 300L870 300L870 340" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="925" y="286" class="small" text-anchor="middle">脚本调用普通命令</text><path d="M650 223L650 300L325 300L325 340" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="475" y="286" class="small" text-anchor="middle">运行栈</text><text x="32" y="550" font-size="13" fill="#6c817c">脚本执行与其他命令不交错；原子隔离不等于运行时错误回滚。</text></svg>