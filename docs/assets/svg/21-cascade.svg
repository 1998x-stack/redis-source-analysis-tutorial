<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r21cascade-t r21cascade-d"><title id="r21cascade-t">级联复制：上游与下游共享一条历史但延迟叠加</title><desc id="r21cascade-d">M→R1→R2 的级联，R1 接受上游复制流并转发给下游；链路任一段的延迟与断开都会影响链尾，级联不是多主写入。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="60" y="165" width="270" height="145" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="195" y="196" class="head" text-anchor="middle">Primary M</text><text x="195" y="224" class="sub" text-anchor="middle">接收客户端写操作</text><text x="195" y="246" class="sub" text-anchor="middle">生成 replication stream</text><text x="195" y="268" class="sub" text-anchor="middle">master_repl_offset 增长</text></g><g><rect x="470" y="165" width="270" height="145" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="605" y="196" class="head" text-anchor="middle">Replica R1</text><text x="605" y="224" class="sub" text-anchor="middle">复制 M 的数据并提供读取</text><text x="605" y="246" class="sub" text-anchor="middle">转发相同复制流</text><text x="605" y="268" class="sub" text-anchor="middle">保留 backlog 供下游 PSYNC</text></g><g><rect x="880" y="165" width="270" height="145" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="1015" y="196" class="head" text-anchor="middle">Replica R2</text><text x="1015" y="224" class="sub" text-anchor="middle">从 R1 复制</text><text x="1015" y="246" class="sub" text-anchor="middle">读链路延迟和 ACK 位置</text><text x="1015" y="268" class="sub" text-anchor="middle">不能写入全局主历史</text></g><path d="M330 235L465 235" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="397.5" y="223" class="small" text-anchor="middle">stream ①</text><path d="M740 235L875 235" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="807.5" y="223" class="small" text-anchor="middle">stream ②</text><g><rect x="300" y="385" width="600" height="105" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="600" y="416" class="head" text-anchor="middle">链尾端到端延迟</text><text x="600" y="444" class="sub" text-anchor="middle">上游传播 + R1 执行/调度 + 下游传播/应用</text><text x="600" y="466" class="sub" text-anchor="middle">R1 重选上游或全量同步可令 R2 重建同步</text></g><text x="32" y="550" font-size="13" fill="#6c817c">级联复制没有消除异步一致性窗口，只是改变拓扑和带宽分布。</text></svg>