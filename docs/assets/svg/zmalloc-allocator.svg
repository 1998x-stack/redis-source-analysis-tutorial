<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title-malloc desc-malloc"><title id="title-malloc">zmalloc 的两个互斥内存统计分支</title><desc id="desc-malloc">HAVE_MALLOC_SIZE 时无前缀；否则使用 size_t 前缀存储请求大小；两条路径都更新 used_memory</desc><defs><marker id="arrow-malloc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-malloc" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="420" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="420" fill="url(#dots-malloc)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">zmalloc 的两个互斥内存统计分支</text><rect x="340" y="79" width="280" height="80" rx="12" fill="#e7f2ef" stroke="#63998e" stroke-width="1.8"/><text x="480" y="113" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">zmalloc(size)</text><text x="480" y="138" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">调用底层 malloc</text><path d="M420 161 L257 211" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-malloc)"/><path d="M540 161 L701 211" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-malloc)"/><rect x="62" y="221" width="353" height="110" rx="12" fill="#e6f3ef" stroke="#5c9990" stroke-width="1.8"/><text x="238.5" y="255" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">有 HAVE_MALLOC_SIZE</text><text x="238.5" y="280" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">PREFIX_SIZE = 0; 询问可用块大小</text><rect x="543" y="221" width="353" height="110" rx="12" fill="#f9ede8" stroke="#c77c5d" stroke-width="1.8"/><text x="719.5" y="255" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">无 HAVE_MALLOC_SIZE</text><text x="719.5" y="280" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">PREFIX_SIZE &gt; 0; 写入请求大小</text><path d="M235 333 L415 369" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-malloc)"/><path d="M722 333 L545 369" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-malloc)"/><rect x="420" y="362" width="120" height="46" rx="12" fill="#eceaf8" stroke="#8370af" stroke-width="1.8"/><text x="480" y="381" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">used_memory</text><text x="480" y="406" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">原子累计</text><text x="36" y="408" font-size="13" fill="#5c6e70" font-family="Arial,'Noto Sans CJK SC'">注意：这里是分支示意而非实际分配尺寸图；碎片及 RSS 不能直接从 used_memory 推断。</text></svg>