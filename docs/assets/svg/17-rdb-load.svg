<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="rdb-load-title rdb-load-desc"><title id="rdb-load-title">RDB 恢复时的格式检查与键恢复</title><desc id="rdb-load-desc">加载器读取头部和版本，逐项解释 opcode，恢复数据库选择、对象及过期属性，最终检查 EOF 与校验和；任何不兼容或损坏都可能使加载失败。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="40" y="145" width="190" height="100" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="135" y="176" class="head" text-anchor="middle">打开文件</text><text x="135" y="203" class="sub" text-anchor="middle">读 9 字节头部</text><text x="135" y="225" class="sub" text-anchor="middle">校验 REDIS + 版本</text></g><g><rect x="285" y="145" width="190" height="100" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="380" y="176" class="head" text-anchor="middle">读取 opcode</text><text x="380" y="203" class="sub" text-anchor="middle">AUX / SELECTDB</text><text x="380" y="225" class="sub" text-anchor="middle">RESIZEDB / EOF</text></g><g><rect x="530" y="145" width="190" height="100" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="625" y="176" class="head" text-anchor="middle">恢复 key/value</text><text x="625" y="203" class="sub" text-anchor="middle">RDB type decoder</text><text x="625" y="225" class="sub" text-anchor="middle">过期时间属性</text></g><g><rect x="775" y="145" width="190" height="100" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="870" y="176" class="head" text-anchor="middle">完整性检查</text><text x="870" y="203" class="sub" text-anchor="middle">EOF / CRC64</text><text x="870" y="225" class="sub" text-anchor="middle">文件读取状态</text></g><g><rect x="1010" y="145" width="150" height="100" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="1085" y="176" class="head" text-anchor="middle">完成</text><text x="1085" y="203" class="sub" text-anchor="middle">装载成功</text></g><path d="M230 195 L280 195" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M475 195 L525 195" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M720 195 L770 195" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M965 195 L1005 195" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="355" y="345" width="490" height="90" rx="13" fill="#faecea" stroke="#b75d56" stroke-width="1.7"/><text x="600" y="376" class="head" text-anchor="middle">版本不支持 / 对象解码失败 / 校验不通过</text><text x="600" y="403" class="sub" text-anchor="middle">报错并中止本次加载；不要把失败恢复当成空库成功</text></g><path d="M625 245 L625 340" fill="none" stroke="#b75d56" stroke-width="2.5" marker-end="url(#arr)"/><text x="700" y="300" class="edge" text-anchor="middle">异常路径</text><text x="34" y="548" font-size="13" fill="#71827f">校验和关闭会改变 checksum 字段；rdbchecksum no 时，文件尾校验值为 0。</text></svg>