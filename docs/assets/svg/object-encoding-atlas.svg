<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title-encodings desc-encodings"><title id="title-encodings">一个逻辑类型可以有多种编码</title><desc id="desc-encodings">Redis 7.2.4 中小 Set 也可为 listpack；List 既可为 listpack，也可为 quicklist。</desc><defs><marker id="arrow-encodings" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53736f"/></marker><pattern id="grid-encodings" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1eae6"/></pattern></defs><rect width="960" height="500" rx="14" fill="#fbfcf9"/><rect width="960" height="500" fill="url(#grid-encodings)"/><text x="30" y="42" font-size="20" font-weight="700" fill="#20363b" font-family="Arial,'Noto Sans CJK SC',sans-serif">一个逻辑类型可以有多种编码</text><rect x="43" y="91" width="420" height="84" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="253" y="128.8" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">STRING</text><text x="253" y="151.48" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">int · embstr · raw</text><rect x="501" y="91" width="420" height="84" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="711" y="128.8" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">LIST</text><text x="711" y="151.48" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">listpack · quicklist</text><rect x="43" y="198" width="420" height="84" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="253" y="235.8" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">HASH</text><text x="253" y="258.48" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">listpack · hashtable</text><rect x="501" y="198" width="420" height="84" rx="11" fill="#efebfa" stroke="#7257a4" stroke-width="1.7"/><text x="711" y="235.8" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">SET</text><text x="711" y="258.48" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">intset · listpack · hashtable</text><rect x="43" y="305" width="420" height="84" rx="11" fill="#dff1ea" stroke="#158080" stroke-width="1.7"/><text x="253" y="342.8" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">ZSET</text><text x="253" y="365.48" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">listpack · skiplist</text><rect x="501" y="305" width="420" height="84" rx="11" fill="#faeee7" stroke="#b86245" stroke-width="1.7"/><text x="711" y="342.8" fill="#20363b" font-size="18" text-anchor="middle" font-weight="700" font-family="Arial,'Noto Sans CJK SC',sans-serif">STREAM</text><text x="711" y="365.48" fill="#557078" font-size="13" text-anchor="middle" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">stream (rax/listpacks)</text><text x="50" y="452" fill="#557078" font-size="15" text-anchor="start" font-weight="400" font-family="Arial,'Noto Sans CJK SC',sans-serif">图中是 Redis 7.2.4 的可观测编码类别；数值取决于键内容、配置和实际命令路径。</text></svg>