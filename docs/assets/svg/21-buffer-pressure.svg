<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r21buf-t r21buf-d"><title id="r21buf-t">复制积压缓冲区、网络输出与慢副本的背压</title><desc id="r21buf-d">共享 replBufBlock 被 backlog 和各 replica 引用；慢副本无法及时发送时会积累缓冲，输出缓冲限制可能触发客户端断开；复连需检查 backlog。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="405" y="95" width="380" height="95" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="595" y="126" class="head" text-anchor="middle">Primary replication stream</text><text x="595" y="154" class="sub" text-anchor="middle">source of ordered bytes / master offset</text></g><g><rect x="35" y="300" width="310" height="116" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="190" y="331" class="head" text-anchor="middle">共享 replBufBlock 列表</text><text x="190" y="359" class="sub" text-anchor="middle">引用计数管理不同消费者</text><text x="190" y="381" class="sub" text-anchor="middle">慢客户端可保留旧块</text></g><g><rect x="445" y="300" width="300" height="116" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="595" y="331" class="head" text-anchor="middle">Backlog 逻辑窗口</text><text x="595" y="359" class="sub" text-anchor="middle">offset / histlen / rax index</text><text x="595" y="381" class="sub" text-anchor="middle">用于 PSYNC 缺失区间</text></g><g><rect x="845" y="300" width="305" height="116" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="997.5" y="331" class="head" text-anchor="middle">Replica output state</text><text x="997.5" y="359" class="sub" text-anchor="middle">repl_ack_off / output limits</text><text x="997.5" y="381" class="sub" text-anchor="middle">慢副本可能被断开</text></g><path d="M505 190L190 286" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="345" y="235" class="small" text-anchor="middle">新增块</text><path d="M345 358L440 358" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="392.5" y="346" class="small" text-anchor="middle">backlog 引用</text><path d="M745 358L840 358" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="792.5" y="346" class="small" text-anchor="middle">客户端引用</text><g><rect x="370" y="460" width="465" height="62" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="602.5" y="491" class="head" text-anchor="middle">断连重试：replication ID + backlog 区间</text><text x="602.5" y="519" class="sub" text-anchor="middle">过旧的 offset → FULLRESYNC</text></g><text x="32" y="550" font-size="13" fill="#6c817c">逻辑 backlog 窗口和共享块的真实物理占用不严格相等。</text></svg>