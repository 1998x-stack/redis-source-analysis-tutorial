<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title-grow desc-grow"><title id="title-grow">SDS 预分配与空闲空间：名义容量的增长</title><desc id="desc-grow">sdsMakeRoomFor 以长度加新增字节的需求计算；小于 1MiB 的分支通常翻倍，较大时增加 1MiB</desc><defs><marker id="arrow-grow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#496b70"/></marker><pattern id="dots-grow" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dbe7e4"/></pattern></defs><rect width="960" height="420" rx="14" fill="#f9fbf8"/><rect x="0" y="0" width="960" height="420" fill="url(#dots-grow)"/><text x="30" y="39" font-size="19" font-weight="700" fill="#213b40" font-family="Arial,'Noto Sans CJK SC',sans-serif">SDS 预分配与空闲空间：名义容量的增长</text><rect x="42" y="85" width="195" height="95" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="139.5" y="119" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">len = 12</text><text x="139.5" y="144" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">alloc = 12, free = 0</text><rect x="294" y="85" width="195" height="95" rx="12" fill="#f9efe5" stroke="#c17c59" stroke-width="1.8"/><text x="391.5" y="119" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">append 8</text><text x="391.5" y="144" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">需要至少 20 bytes</text><rect x="547" y="85" width="195" height="95" rx="12" fill="#e7f3ee" stroke="#559a8d" stroke-width="1.8"/><text x="644.5" y="119" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">贪婪扩容</text><text x="644.5" y="144" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">nominal 40 bytes</text><rect x="788" y="85" width="135" height="95" rx="12" fill="#edf5f2" stroke="#5a9992" stroke-width="1.8"/><text x="855.5" y="119" fill="#19393e" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">写入后</text><text x="855.5" y="144" fill="#53676d" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="13">len = 20</text><path d="M237 132 L284 132" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-grow)"/><path d="M489 132 L537 132" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-grow)"/><path d="M742 132 L778 132" stroke="#496b70" stroke-width="2.4" fill="none" marker-end="url(#arrow-grow)"/><text x="52" y="237" fill="#45616a" font-size="16" font-family="Arial,'Noto Sans CJK SC'">概念性内存条：used / free（不按真实比例）</text><rect x="60" y="263" width="780" height="56" rx="7" fill="#eff3f0" stroke="#a6c1b7"/><rect x="60" y="263" width="390" height="56" rx="7" fill="#54a295"/><rect x="450" y="263" width="390" height="56" rx="7" fill="#dfece7"/><text x="246" y="296" text-anchor="middle" font-size="17" fill="#fff" font-family="Arial,sans-serif">used = 20</text><text x="645" y="296" text-anchor="middle" font-size="17" fill="#466b65" font-family="Arial,sans-serif">free ≈ 20</text><text x="55" y="387" font-size="14" fill="#52696b" font-family="Arial,'Noto Sans CJK SC'">实际 alloc 还可能包含分配器可用块余量；SDS 类型升级也改变头部大小。</text></svg>