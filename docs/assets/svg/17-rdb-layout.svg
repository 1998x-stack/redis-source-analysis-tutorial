<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="rdb-layout-title rdb-layout-desc"><title id="rdb-layout-title">Redis 7.2.4 RDB 文件的逻辑结构</title><desc id="rdb-layout-desc">RDB v11 文件以 REDIS0011 标识，包含 AUX / Functions / DB 选择和尺寸提示、键属性和类型值，最后以 EOF 和 CRC64 结束。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="35" y="145" width="145" height="115" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="107.5" y="176" class="head" text-anchor="middle">Header</text><text x="107.5" y="203" class="sub" text-anchor="middle">REDIS0011</text><text x="107.5" y="225" class="sub" text-anchor="middle">RDB_VERSION=11</text></g><g><rect x="205" y="145" width="155" height="115" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="282.5" y="176" class="head" text-anchor="middle">AUX</text><text x="282.5" y="203" class="sub" text-anchor="middle">版本 / 运行信息</text><text x="282.5" y="225" class="sub" text-anchor="middle">可扩展元数据</text></g><g><rect x="385" y="145" width="155" height="115" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="462.5" y="176" class="head" text-anchor="middle">DB 控制</text><text x="462.5" y="203" class="sub" text-anchor="middle">SELECTDB</text><text x="462.5" y="225" class="sub" text-anchor="middle">RESIZEDB</text></g><g><rect x="565" y="145" width="170" height="115" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="650" y="176" class="head" text-anchor="middle">键属性</text><text x="650" y="203" class="sub" text-anchor="middle">EXPIRETIME_MS</text><text x="650" y="225" class="sub" text-anchor="middle">IDLE / FREQ</text></g><g><rect x="760" y="145" width="170" height="115" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="845" y="176" class="head" text-anchor="middle">对象记录</text><text x="845" y="203" class="sub" text-anchor="middle">type + key</text><text x="845" y="225" class="sub" text-anchor="middle">encoded value</text></g><g><rect x="955" y="145" width="205" height="115" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="1057.5" y="176" class="head" text-anchor="middle">文件尾</text><text x="1057.5" y="203" class="sub" text-anchor="middle">EOF opcode</text><text x="1057.5" y="225" class="sub" text-anchor="middle">CRC64 checksum</text></g><path d="M180 202 L200 202" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M360 202 L380 202" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M540 202 L560 202" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M735 202 L755 202" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M930 202 L950 202" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="210" y="345" width="780" height="95" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="600" y="376" class="head" text-anchor="middle">对象编码不是内存布局的逐字节复制</text><text x="600" y="403" class="sub" text-anchor="middle">字符串可用整数 / LZF 等编码；集合类按 RDB type 编码</text><text x="600" y="425" class="sub" text-anchor="middle">加载时再恢复为适合当前运行时的内部对象表示</text></g><text x="34" y="548" font-size="13" fill="#71827f">RDB 的二进制 type code 是持久化格式，不等于 redisObject 的内部 encoding 常量。</text></svg>