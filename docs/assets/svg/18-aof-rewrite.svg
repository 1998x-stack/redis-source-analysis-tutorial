<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="aof-rewrite-title aof-rewrite-desc"><title id="aof-rewrite-title">7.2 Multi-Part AOF 重写时间线</title><desc id="aof-rewrite-desc">父进程在 fork 前打开新的 INCR AOF 接收后续写入，子进程生成临时 BASE；成功后父进程构建并持久化新 manifest，再切换清理历史文件。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="45" y="115" width="220" height="110" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="155" y="146" class="head" text-anchor="middle">T0：准备</text><text x="155" y="173" class="sub" text-anchor="middle">flush 当前缓冲</text><text x="155" y="195" class="sub" text-anchor="middle">open new INCR</text></g><g><rect x="340" y="115" width="220" height="110" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="450" y="146" class="head" text-anchor="middle">T1：fork</text><text x="450" y="173" class="sub" text-anchor="middle">父进程继续写 INCR</text><text x="450" y="195" class="sub" text-anchor="middle">子进程生成 BASE</text></g><g><rect x="635" y="115" width="220" height="110" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="745" y="146" class="head" text-anchor="middle">T2：子进程完成</text><text x="745" y="173" class="sub" text-anchor="middle">临时 BASE fsync</text><text x="745" y="195" class="sub" text-anchor="middle">通知父进程</text></g><g><rect x="930" y="115" width="220" height="110" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="1040" y="146" class="head" text-anchor="middle">T3：提交</text><text x="1040" y="173" class="sub" text-anchor="middle">新 manifest 原子替换</text><text x="1040" y="195" class="sub" text-anchor="middle">旧文件进入 HISTORY</text></g><path d="M265 170 L335 170" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M560 170 L630 170" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M855 170 L925 170" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="160" y="335" width="880" height="105" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="600" y="366" class="head" text-anchor="middle">重写期间并发写入不会丢失</text><text x="600" y="393" class="sub" text-anchor="middle">失败：旧 BASE + 旧 INCR + 新 INCR 仍可描述完整数据集</text><text x="600" y="415" class="sub" text-anchor="middle">成功：新 BASE + rewrite 期间 INCR 成为新的当前文件集合</text></g><path d="M450 225 L450 325" fill="none" stroke="#c36b45" stroke-width="2.5" marker-end="url(#arr)"/><text x="500" y="290" class="edge" text-anchor="middle">父进程写入</text><path d="M745 225 L745 325" fill="none" stroke="#52799b" stroke-width="2.5" marker-end="url(#arr)"/><text x="800" y="290" class="edge" text-anchor="middle">子进程输出</text><text x="34" y="548" font-size="13" fill="#71827f">manifest 是文件集合的权威索引；备份必须一致地复制 manifest 及其引用的全部当前文件。</text></svg>