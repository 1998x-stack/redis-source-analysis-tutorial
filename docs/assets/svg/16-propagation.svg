<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="cmd-propagation-title cmd-propagation-desc"><title id="cmd-propagation-title">命令执行、统计与传播是相关但不同的输出</title><desc id="cmd-propagation-desc">call 记录执行前后的 dirty 差值和运行时间；根据 flags 与强制/禁止传播标志决定是否将操作加入 also_propagate，随后执行单元收尾时传播到 AOF 与复制流。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="440" y="85" width="320" height="105" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="600" y="116" class="head" text-anchor="middle">命令处理器 proc()</text><text x="600" y="143" class="sub" text-anchor="middle">数据结构变化 / 回复构造</text><text x="600" y="165" class="sub" text-anchor="middle">dirty 可能增加</text></g><g><rect x="70" y="290" width="245" height="110" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="192.5" y="321" class="head" text-anchor="middle">可观测统计</text><text x="192.5" y="348" class="sub" text-anchor="middle">commandstats / latency</text><text x="192.5" y="370" class="sub" text-anchor="middle">SLOWLOG / MONITOR</text></g><g><rect x="475" y="290" width="245" height="110" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="597.5" y="321" class="head" text-anchor="middle">传播决策</text><text x="597.5" y="348" class="sub" text-anchor="middle">dirty delta + call flags</text><text x="597.5" y="370" class="sub" text-anchor="middle">force / prevent propagation</text></g><g><rect x="885" y="290" width="245" height="110" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="1007.5" y="321" class="head" text-anchor="middle">持久化与复制</text><text x="1007.5" y="348" class="sub" text-anchor="middle">AOF append buffer</text><text x="1007.5" y="370" class="sub" text-anchor="middle">replication stream</text></g><path d="M500 190 L200 280" fill="none" stroke="#7561a9" stroke-width="2.5" marker-end="url(#arr)"/><text x="340" y="245" class="edge" text-anchor="middle">耗时 / 调用记录</text><path d="M600 190 L600 280" fill="none" stroke="#c36b45" stroke-width="2.7" marker-end="url(#arr)"/><text x="600" y="225" class="edge" text-anchor="middle">执行后差值</text><path d="M720 345 L875 345" fill="none" stroke="#52799b" stroke-width="2.5" marker-end="url(#arr)"/><text x="800" y="325" class="edge" text-anchor="middle">alsoPropagate / propagateNow</text><g><rect x="460" y="445" width="280" height="65" rx="13" fill="#f1f4f3" stroke="#71827f" stroke-width="1.7"/><text x="600" y="476" class="head" text-anchor="middle">postExecutionUnitOperations()</text><text x="600" y="503" class="sub" text-anchor="middle">汇总待传播操作</text></g><path d="M600 400 L600 440" fill="none" stroke="#71827f" stroke-width="2.5" marker-end="url(#arr)"/><text x="740" y="430" class="edge" text-anchor="middle">外层执行单元结束</text><text x="34" y="548" font-size="13" fill="#71827f">回复是在命令处理过程中构造；AOF/复制传播有独立条件，不是所有调用都机械写出一条原始命令。</text></svg>