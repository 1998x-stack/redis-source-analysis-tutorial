<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="eviction-pool-title eviction-pool-desc"><title id="eviction-pool-title">近似淘汰：抽样候选与有界候选池</title><desc id="eviction-pool-desc">LRU/LFU/volatile-ttl 路径会从符合 policy 的字典抽样，计算分数后放入 eviction pool，再从较差候选中验证 key 仍存在并淘汰。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71827f"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4ece8"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Noto Sans",sans-serif}.head{font-size:19px;font-weight:700;fill:#213b40}.sub{font-size:14px;fill:#526a6c}.edge{font-size:13px;fill:#526a6c;font-weight:700}</style><rect width="1200" height="580" rx="16" fill="#fbfcfa"/><rect width="1200" height="580" rx="16" fill="url(#grid)"/><text x="34" y="42" font-size="14" fill="#6b807b" letter-spacing="2">REDIS 7.2.4 / SOURCE MAP</text><g><rect x="45" y="115" width="220" height="110" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="155" y="146" class="head" text-anchor="middle">候选范围</text><text x="155" y="173" class="sub" text-anchor="middle">allkeys: db-&gt;dict</text><text x="155" y="195" class="sub" text-anchor="middle">volatile: db-&gt;expires</text></g><g><rect x="345" y="115" width="220" height="110" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="455" y="146" class="head" text-anchor="middle">随机抽样</text><text x="455" y="173" class="sub" text-anchor="middle">maxmemory-samples</text><text x="455" y="195" class="sub" text-anchor="middle">跨 DB 收集样本</text></g><g><rect x="645" y="115" width="220" height="110" rx="13" fill="#f0edfa" stroke="#7561a9" stroke-width="1.7"/><text x="755" y="146" class="head" text-anchor="middle">候选评分</text><text x="755" y="173" class="sub" text-anchor="middle">LRU idle / LFU freq</text><text x="755" y="195" class="sub" text-anchor="middle">TTL remaining</text></g><g><rect x="945" y="115" width="210" height="110" rx="13" fill="#fbefe7" stroke="#c36b45" stroke-width="1.7"/><text x="1050" y="146" class="head" text-anchor="middle">淘汰池</text><text x="1050" y="173" class="sub" text-anchor="middle">保留较优候选</text><text x="1050" y="195" class="sub" text-anchor="middle">删除最差有效 key</text></g><path d="M265 170 L340 170" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M565 170 L640 170" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><path d="M865 170 L940 170" fill="none" stroke="#71827f" stroke-width="2.7" marker-end="url(#arr)"/><g><rect x="150" y="330" width="260" height="95" rx="13" fill="#e6f4ef" stroke="#167e80" stroke-width="1.7"/><text x="280" y="361" class="head" text-anchor="middle">allkeys-*</text><text x="280" y="388" class="sub" text-anchor="middle">整个 keyspace 都可被选</text></g><g><rect x="470" y="330" width="260" height="95" rx="13" fill="#eaf1f8" stroke="#52799b" stroke-width="1.7"/><text x="600" y="361" class="head" text-anchor="middle">volatile-*</text><text x="600" y="388" class="sub" text-anchor="middle">只从带过期时间的键中选</text></g><g><rect x="790" y="330" width="260" height="95" rx="13" fill="#faecea" stroke="#b75d56" stroke-width="1.7"/><text x="920" y="361" class="head" text-anchor="middle">noeviction</text><text x="920" y="388" class="sub" text-anchor="middle">不删键；拒绝需新增内存的写</text></g><path d="M1050 225 L1050 285 L280 285 L280 325" fill="none" stroke="#71827f" stroke-width="2.5" marker-end="url(#arr)"/><text x="620" y="278" class="edge" text-anchor="middle">策略决定候选集合</text><path d="M1050 225 L1050 285 L600 285 L600 325" fill="none" stroke="#71827f" stroke-width="2.5" marker-end="url(#arr)"/><text x="820" y="278" class="edge" text-anchor="middle">volatile / allkeys</text><path d="M1050 225 L1050 285 L920 285 L920 325" fill="none" stroke="#b75d56" stroke-width="2.5" marker-end="url(#arr)"/><text x="980" y="278" class="edge" text-anchor="middle">noeviction 直接失败</text><text x="34" y="548" font-size="13" fill="#71827f">LRU 与 LFU 都是近似模型，不维护全局精确的排序列表。</text></svg>