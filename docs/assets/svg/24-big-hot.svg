<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="r24big-t r24big-d"><title id="r24big-t">Bigkey 和 Hotkey 的正交风险</title><desc id="r24big-d">Bigkey 是单个键占用内存或元素数量大，Hotkey 是访问频率/流量集中；一个键可以既大又热，导致 CPU、网络和内存风险叠加。</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71857f"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e3eae6"/></pattern></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.head{font-size:18px;font-weight:700;fill:#1c3a40}.sub{font-size:14px;fill:#50666a}.small{font-size:14px;fill:#50666a;font-weight:700}</style><rect width="1200" height="580" rx="14" fill="#fbfcfa"/><rect width="1200" height="580" rx="14" fill="url(#dots)"/><text x="32" y="39" font-size="14" letter-spacing="2" fill="#6c817c">REDIS 7.2.4 / SOURCE-ANCHORED MODEL</text><g><rect x="70" y="110" width="300" height="110" rx="13" fill="#eaf1f9" stroke="#577d9a" stroke-width="1.7"/><text x="220" y="141" class="head" text-anchor="middle">Bigkey：空间问题</text><text x="220" y="169" class="sub" text-anchor="middle">MEMORY USAGE / 元素计数</text><text x="220" y="191" class="sub" text-anchor="middle">HGETALL / SMEMBERS / DEL</text></g><g><rect x="830" y="110" width="300" height="110" rx="13" fill="#fbefe6" stroke="#b86c46" stroke-width="1.7"/><text x="980" y="141" class="head" text-anchor="middle">Hotkey：流量问题</text><text x="980" y="169" class="sub" text-anchor="middle">LFU 频率近似 / 入口 QPS</text><text x="980" y="191" class="sub" text-anchor="middle">带宽、请求串行排队</text></g><g><rect x="415" y="290" width="370" height="115" rx="13" fill="#faecea" stroke="#b4564b" stroke-width="1.7"/><text x="600" y="321" class="head" text-anchor="middle">Big + Hot 同时出现</text><text x="600" y="349" class="sub" text-anchor="middle">大回复 + 高频访问</text><text x="600" y="371" class="sub" text-anchor="middle">内存、网络和事件循环共同受压</text></g><path d="M240 220L240 280L495 280L495 286" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="355" y="265" class="small" text-anchor="middle">大对象访问</text><path d="M970 220L970 280L705 280L705 286" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="850" y="265" class="small" text-anchor="middle">流量汇聚</text><g><rect x="90" y="450" width="320" height="65" rx="13" fill="#e6f3ef" stroke="#16827d" stroke-width="1.7"/><text x="250" y="481" class="head" text-anchor="middle">处理空间：拆分 / 分页 / UNLINK</text><text x="250" y="509" class="sub" text-anchor="middle">避免一次返回整集合</text></g><g><rect x="790" y="450" width="320" height="65" rx="13" fill="#f0edf8" stroke="#7764a8" stroke-width="1.7"/><text x="950" y="481" class="head" text-anchor="middle">处理流量：限流 / 分片 / 本地缓存</text><text x="950" y="509" class="sub" text-anchor="middle">注意一致性与热点转移</text></g><path d="M510 405L250 446" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="360" y="430" class="small" text-anchor="middle">空间治理</text><path d="M690 405L950 446" fill="none" stroke="#71857f" stroke-width="2.5" marker-end="url(#ar)"/><text x="835" y="430" class="small" text-anchor="middle">流量治理</text><text x="32" y="550" font-size="13" fill="#6c817c">大键与热键的识别工具不同；--hotkeys 需要 LFU policy，--bigkeys 不等于精确内存排行。</text></svg>